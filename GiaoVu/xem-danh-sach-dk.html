<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách đăng ký - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="container-fluid">
        <h2 class="section-title">
            <span class="material-symbols-outlined text-primary" style="font-size: 32px;">list_alt</span>
            Danh sách đăng ký học
        </h2>

        <div class="card border-0 mb-4">
            <div class="row align-items-end g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Chọn lớp học phần</label>
                    <select id="lhpSelect" class="form-select" onchange="renderReg()"></select>
                </div>
            </div>
        </div>

        <div id="statsRow" class="row mb-4 d-none animate__animated animate__fadeIn">
            <div class="col-md-4">
                <div class="card border-0 bg-primary text-white p-4">
                    <div class="small opacity-75 fw-bold">TỔNG ĐĂNG KÝ</div>
                    <div class="h2 fw-800 mb-0" id="totalReg">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 bg-success text-white p-4">
                    <div class="small opacity-75 fw-bold">ĐANG HỌC</div>
                    <div class="h2 fw-800 mb-0" id="activeReg">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 bg-danger text-white p-4">
                    <div class="small opacity-75 fw-bold">ĐÃ HỦY</div>
                    <div class="h2 fw-800 mb-0" id="cancelledReg">0</div>
                </div>
            </div>
        </div>

        <div class="card border-0">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Mã SV</th>
                            <th>Họ tên</th>
                            <th>Ngày đăng ký</th>
                            <th class="text-center">Trạng thái</th>
                            <th class="text-center">Điểm tổng kết</th>
                        </tr>
                    </thead>
                    <tbody id="regBody">
                        <tr><td colspan="5" class="text-center py-5 text-muted italic">Chọn lớp để xem dữ liệu</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['GiaoVu']);
        function init() {
            const l = JSON.parse(localStorage.getItem('LopHocPhan') || '[]'), m = JSON.parse(localStorage.getItem('MonHoc') || '[]'), h = JSON.parse(localStorage.getItem('HocKy') || '[]');
            document.getElementById('lhpSelect').innerHTML = '<option value="">-- Chọn lớp học phần --</option>' + l.map(x => `<option value="${x.MaLHP}">${x.MaLHP} - ${(m.find(z => z.MaMH === x.MaMH) || {}).TenMH} (${(h.find(z => z.MaHK === x.MaHK) || {}).TenHK})</option>`).join('');
        }
        function renderReg() {
            const id = document.getElementById('lhpSelect').value; if (!id) return;
            const dk = JSON.parse(localStorage.getItem('DangKyHoc') || '[]').filter(x => x.MaLHP === id);
            const sv = JSON.parse(localStorage.getItem('SinhVien') || '[]'), bd = JSON.parse(localStorage.getItem('BangDiem') || '[]');
            document.getElementById('statsRow').classList.remove('d-none');
            document.getElementById('totalReg').innerText = dk.length;
            document.getElementById('activeReg').innerText = dk.filter(x => x.TrangThai === 'DaDangKy').length;
            document.getElementById('cancelledReg').innerText = dk.filter(x => x.TrangThai === 'DaHuy').length;
            document.getElementById('regBody').innerHTML = dk.map(d => {
                const s = sv.find(x => x.MaSV === d.MaSV) || {}, g = bd.find(x => x.MaDK === d.MaDK);
                return `<tr><td><strong>${d.MaSV}</strong></td><td>${s.HoTen}</td><td>${d.NgayDK}</td><td class="text-center"><span class="badge ${d.TrangThai === 'DaDangKy' ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">${d.TrangThai}</span></td><td class="text-center fw-bold text-accent">${g ? g.DiemTongKet : '-'}</td></tr>`;
            }).join('');
        }
        init();
    </script>
</body>
</html>
