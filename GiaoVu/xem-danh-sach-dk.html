<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách đăng ký - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div id="main-wrapper">
        <aside class="sidebar" id="dynamicSidebar"></aside>

        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" id="searchInput" placeholder="Tìm mã SV, họ tên..." oninput="renderReg(1)">
            </div>
            
            <div class="nav-user">
                <div class="top-links d-none d-md-flex me-3">
                    <a href="dashboard.html" class="text-decoration-none text-main me-3">Trang chủ</a>
                    <a href="#" onclick="alert('Thông báo đang được cập nhật...')" class="text-decoration-none text-main">Thông báo</a>
                </div>
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=GV&background=0D8ABC&color=fff" alt="Avatar" class="avatar ms-2" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
            </div>
        </header>

        <main class="main-content">
            <h2 class="section-title mb-4">
                <span class="material-symbols-outlined text-primary" style="font-size: 32px;">list_alt</span>
                Theo dõi tình trạng Đăng ký học phần
            </h2>

            <div class="card border-0 mb-4 p-3 shadow-sm" style="border-radius: 16px;">
                <div class="row align-items-end g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small">CHỌN LỚP HỌC PHẦN CẦN XEM</label>
                        <select id="lhpSelect" class="form-select border-light-subtle rounded-pill px-3 shadow-sm" onchange="renderReg(1)">
                            <option value="">Đang truy xuất danh sách lớp học phần...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="statsRow" class="row mb-4 d-none animate__animated animate__fadeInUp">
                <div class="col-md-4">
                    <div class="card border-0 text-white p-4 shadow-sm" style="border-radius: 20px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);">
                        <div class="small opacity-75 fw-bold mb-1">TỔNG LƯỢT ĐĂNG KÝ</div>
                        <div class="h2 fw-bold mb-0 font-monospace" id="totalReg">0</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 text-white p-4 shadow-sm" style="border-radius: 20px; background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                        <div class="small opacity-75 fw-bold mb-1">TRẠNG THÁI: ĐANG HỌC</div>
                        <div class="h2 fw-bold mb-0 font-monospace" id="activeReg">0</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 text-white p-4 shadow-sm" style="border-radius: 20px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">
                        <div class="small opacity-75 fw-bold mb-1">TRẠNG THÁI: ĐÃ HỦY MÔN</div>
                        <div class="h2 fw-bold mb-0 font-monospace" id="cancelledReg">0</div>
                    </div>
                </div>
            </div>

            <div class="card border-0 p-3 shadow-sm" style="border-radius: 20px;">
                <div class="table-responsive">
                    <table class="table align-middle table-custom table-hover m-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 py-3">Mã SV</th>
                                <th>Họ Tên Sinh Viên</th>
                                <th>Thời gian đăng ký</th>
                                <th class="text-center">Trạng thái</th>
                                <th class="text-center pe-4">Trạng thái nạp điểm</th>
                            </tr>
                        </thead>
                        <tbody id="regBody">
                            <tr><td colspan="5" class="text-center py-5 text-muted fw-medium">Vui lòng chọn một lớp học phần bên trên để xem dữ liệu đăng ký.</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-end align-items-center mt-3 border-top pt-3">
                    <nav>
                        <ul class="pagination pagination-sm mb-0 rounded-pill shadow-sm" id="paginationList"></ul>
                    </nav>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/auth.js"></script>

    <script>
        Auth.checkAuth(['GiaoVu']);
        const user = Auth.getCurrentUser();
        
        let allRegistrations = []; 
        let allLHP = [];           
        
        let currentPage = 1;
        const rowsPerPage = 6;

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            sidebar.innerHTML = `
                <div class="nav-brand text-start"><div style="color: var(--accent); font-size: 1.5rem;">EduManage</div><div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted); letter-spacing: normal;">Phòng Đào Tạo</div></div>
                <ul class="nav-menu">
                    <li><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                    <li><a href="mon-hoc.html"><span class="material-symbols-outlined menu-icon">book</span>Môn học</a></li>
                    <li><a href="mo-lop-hoc-phan.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Học kỳ & Mở lớp</a></li>
                    <li class="active"><a href="xem-danh-sach-dk.html"><span class="material-symbols-outlined menu-icon">how_to_reg</span>Danh sách đăng ký</a></li>
                    <li><a href="giang-day-diem.html"><span class="material-symbols-outlined menu-icon">menu_book</span>Giảng dạy & Điểm</a></li>
                </ul>
                <div style="padding: 1rem; margin-top: auto;">
                    <ul class="nav-menu" style="padding: 0;">
                        <li><a href="ho-so.html"><span class="material-symbols-outlined menu-icon">account_circle</span>Hồ sơ Cá nhân</a></li>
                        <li style="margin-top: 1rem;"><a href="#" onclick="Auth.logout()" style="color: #ef4444;"><span class="material-symbols-outlined menu-icon">logout</span>Đăng xuất</a></li>
                    </ul>
                </div>`;
        }

        async function init() {
            renderSidebar();

            let tenGiaoVu = user.name || "Giáo vụ";
            try {
                const profileRes = await Auth.fetchWithAuth('/GiaoVu/ho-so');
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    if (profileData.HoTen) tenGiaoVu = profileData.HoTen;
                }
            } catch(e) {}
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(tenGiaoVu)}&background=0D8ABC&color=fff`;

            try {
                const [resLHP, resReg] = await Promise.all([
                    Auth.fetchWithAuth('/GiaoVu/danh-sach-lop-hoc-phan'),
                    Auth.fetchWithAuth('/GiaoVu/danh-sach-dang-ky')
                ]);

                if (resLHP.ok) allLHP = await resLHP.json();
                if (resReg.ok) allRegistrations = await resReg.json();

                const selectEl = document.getElementById('lhpSelect');
                if (allLHP.length === 0) {
                    selectEl.innerHTML = '<option value="">Hệ thống chưa có lớp học phần nào.</option>';
                    return;
                }

                selectEl.innerHTML = '<option value="">-- Vui lòng chọn Lớp học phần --</option>' + 
                    allLHP.map(x => `<option value="${x.MaLHP || x.malhp}">${x.MaLHP || x.malhp} - ${x.TenMH || x.tenmh} (${x.TenHK || x.tenhk} - ${x.NamHoc || x.namhoc})</option>`).join('');

            } catch (err) {
                console.error("Lỗi khởi tạo màn hình Danh sách đăng ký:", err);
            }
        }

        function renderReg(page = 1) {
            currentPage = page;
            const maLHP = document.getElementById('lhpSelect').value; 
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();

            if (!maLHP) {
                document.getElementById('statsRow').classList.add('d-none');
                document.getElementById('regBody').innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted fw-medium">Vui lòng chọn một lớp học phần bên trên để xem dữ liệu.</td></tr>';
                renderPagination(0, 0);
                return;
            }

            let filteredRegs = allRegistrations.filter(x => (x.MaLHP || x.malhp) === maLHP);

            // ĐÃ SỬA: Xóa bỏ chữ N'...' ra khỏi logic JavaScript
            document.getElementById('statsRow').classList.remove('d-none');
            document.getElementById('totalReg').innerText = filteredRegs.length;
            document.getElementById('activeReg').innerText = filteredRegs.filter(x => (x.TrangThai || x.trangthai) === 'DaDangKy').length;
            document.getElementById('cancelledReg').innerText = filteredRegs.filter(x => (x.TrangThai || x.trangthai) === 'DaHuy').length;

            if (searchKeyword) {
                filteredRegs = filteredRegs.filter(x => {
                    const maSV = (x.MaSV || x.masv || '').toLowerCase();
                    const tenSV = (x.TenSV || x.tensv || '').toLowerCase();
                    return maSV.includes(searchKeyword) || tenSV.includes(searchKeyword);
                });
            }

            const totalRows = filteredRegs.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = filteredRegs.slice(start, end);

            const tbody = document.getElementById('regBody');
            if (totalRows === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted fw-medium">Không có sinh viên nào khớp với tìm kiếm.</td></tr>';
                renderPagination(0, 0);
                return;
            }

            tbody.innerHTML = paginatedItems.map(d => {
                const maSV = d.MaSV || d.masv;
                const tenSV = d.TenSV || d.tensv || 'Chưa cập nhật';
                
                const rawDate = d.NgayDangKy || d.ngaydangky;
                const dateStr = rawDate ? new Date(rawDate).toLocaleString('vi-VN') : '---';
                
                const status = d.TrangThai || d.trangthai;
                // ĐÃ SỬA: Bỏ chữ N'...' ở đây luôn
                const isHuy = status === 'DaHuy';
                
                return `
                <tr class="animate__animated animate__fadeIn" style="border-top: 1px solid #f1f5f9;">
                    <td class="ps-4 py-3"><span class="fw-bold font-monospace text-primary">${maSV}</span></td>
                    <td class="fw-medium text-dark">${tenSV}</td>
                    <td class="text-muted small">${dateStr}</td>
                    <td class="text-center">
                        <span class="badge ${isHuy ? 'bg-danger-subtle text-danger' : 'bg-success-subtle text-success'} rounded-pill px-3 py-1.5" style="font-size: 0.85rem;">
                            ${isHuy ? 'Đã hủy môn' : 'Đang học'}
                        </span>
                    </td>
                    <td class="text-center pe-4">
                        <span class="badge bg-light text-muted border px-2 py-1">Chưa cập nhật</span>
                    </td>
                </tr>`;
            }).join('');

            renderPagination(totalRows, totalPages);
        }

        function renderPagination(totalRows, totalPages) {
            let container = document.getElementById('paginationContainer');
            if (!container) {
                container = document.createElement('div'); container.id = 'paginationContainer';
                container.className = 'd-flex justify-content-end align-items-center mt-3 border-top pt-3';
                document.querySelector('.table-responsive').after(container);
            }
            if (totalRows === 0) { container.innerHTML = ''; return; }
            
            let html = '<nav><ul class="pagination pagination-sm mb-0 rounded-pill shadow-sm">';
            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link d-flex align-items-center justify-content-center" href="#" onclick="renderReg(${currentPage - 1}); return false;" style="width: 32px; height: 32px;"><span class="material-symbols-outlined" style="font-size: 18px; line-height: 1;">chevron_left</span></a></li>`;
            
            for(let i=1; i<=totalPages; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link d-flex align-items-center justify-content-center fw-medium" href="#" onclick="renderReg(${i}); return false;" style="width: 32px; height: 32px;">${i}</a></li>`;
            }
            
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link d-flex align-items-center justify-content-center" href="#" onclick="renderReg(${currentPage + 1}); return false;" style="width: 32px; height: 32px;"><span class="material-symbols-outlined" style="font-size: 18px; line-height: 1;">chevron_right</span></a></li>`;
            html += '</ul></nav>';
            container.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
