<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục môn học - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

    <div id="main-wrapper">
        <aside class="sidebar" id="dynamicSidebar"></aside>

        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" id="searchMH" placeholder="Tìm tên môn hoặc mã môn..." oninput="renderMH(1)">
            </div>
            
            <div class="nav-user">
                <div class="top-links d-none d-md-flex me-3">
                    <a href="dashboard.html" class="text-decoration-none text-main me-3">Trang chủ</a>
                    <a href="#" onclick="alert('Thông báo đang được cập nhật...')" class="text-decoration-none text-main">Thông báo</a>
                </div>
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=GV&background=0D8ABC&color=fff" alt="Avatar" class="avatar ms-2" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
            </div>
        </header>

        <main class="main-content">
            <h2 class="section-title mb-4">
                <span class="material-symbols-outlined text-primary" style="font-size: 32px;">book</span>
                Danh mục Môn học toàn trường
            </h2>

            <div class="card border-0 mb-4 p-3 shadow-sm" style="border-radius: 16px;">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-muted small">LỌC THEO KHOA QUẢN LÝ</label>
                        <select id="khoaFilter" class="form-select border-light-subtle rounded-pill px-3 shadow-sm" onchange="renderMH(1)">
                            <option value="">Tất cả các khoa</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card border-0 p-3 shadow-sm animate__animated animate__fadeIn" style="border-radius: 16px;">
                <div class="table-responsive">
                    <table class="table align-middle table-custom table-hover m-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 py-3">Mã MH</th>
                                <th class="py-3">Tên môn học</th>
                                <th class="text-center py-3">Tín chỉ</th>
                                <th class="py-3 pe-4">Khoa quản lý</th>
                            </tr>
                        </thead>
                        <tbody id="mhBody">
                            <tr><td colspan="4" class="text-center py-5 text-muted fw-medium">Đang truy xuất danh mục môn học đào tạo...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-end align-items-center mt-3 border-top pt-3">
                    <nav>
                        <ul class="pagination pagination-sm mb-0 rounded-pill shadow-sm" id="paginationList"></ul>
                    </nav>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        Auth.checkAuth(['GiaoVu']);
        const user = Auth.getCurrentUser();
        
        let allSubjectsData = []; // Mảng lưu trữ danh mục môn học gốc từ CSDL
        let currentPage = 1;
        const rowsPerPage = 6;

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            sidebar.innerHTML = `
                <div class="nav-brand text-start"><div style="color: var(--accent); font-size: 1.5rem;">EduManage</div><div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted); letter-spacing: normal;">Phòng Đào Tạo</div></div>
                <ul class="nav-menu">
                    <li><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                    <li class="active"><a href="mon-hoc.html"><span class="material-symbols-outlined menu-icon">book</span>Môn học</a></li>
                    <li><a href="mo-lop-hoc-phan.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Học kỳ & Mở lớp</a></li>
                    <li><a href="xem-danh-sach-dk.html"><span class="material-symbols-outlined menu-icon">how_to_reg</span>Danh sách đăng ký</a></li>
                    <li><a href="giang-day-diem.html"><span class="material-symbols-outlined menu-icon">menu_book</span>Giảng dạy & Điểm</a></li>
                </ul>
                <div style="padding: 1rem; margin-top: auto;">
                    <ul class="nav-menu" style="padding: 0;">
                        <li><a href="ho-so.html"><span class="material-symbols-outlined menu-icon">account_circle</span>Hồ sơ Cá nhân</a></li>
                        <li style="margin-top: 1rem;"><a href="#" onclick="Auth.logout()" style="color: #ef4444;"><span class="material-symbols-outlined menu-icon">logout</span>Đăng xuất</a></li>
                    </ul>
                </div>`;
        }

        async function init() {
            renderSidebar();
            
            try {
                // Tải thông tin cá nhân làm Avatar động
                let tenGiaoVu = user.name || "Giáo vụ";
                try {
                    const profileRes = await Auth.fetchWithAuth('/GiaoVu/ho-so');
                    if (profileRes.ok) {
                        const profileData = await profileRes.json();
                        if (profileData.HoTen) tenGiaoVu = profileData.HoTen;
                    }
                } catch(e) {}
                document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(tenGiaoVu)}&background=0D8ABC&color=fff`;

                // Gọi API lấy toàn bộ môn học đào tạo thời gian thực (Dùng chung cổng của Giảng viên)
                const res = await Auth.fetchWithAuth('/GiaoVu/tat-ca-mon-hoc');
                if (res.ok) {
                    allSubjectsData = await res.json();
                    populateKhoaFilter();
                    renderMH(1);
                }
            } catch (err) {
                console.error("Lỗi khởi tạo danh mục môn học:", err);
            }
        }

        // Tạo bộ lọc khoa thông minh tự động gom cụm dựa theo dữ liệu thực tế trả về
        function populateKhoaFilter() {
            const filterSelect = document.getElementById('khoaFilter');
            const uniqueKhoa = {};

            allSubjectsData.forEach(item => {
                const maKhoa = item.MaKhoa || item.makhoa;
                const tenKhoa = item.TenKhoa || item.tenkhoa || `Khoa ${maKhoa}`;
                if (maKhoa) {
                    uniqueKhoa[maKhoa] = tenKhoa;
                }
            });

            filterSelect.innerHTML = '<option value="">Tất cả các khoa</option>';
            Object.keys(uniqueKhoa).forEach(ma => {
                filterSelect.innerHTML += `<option value="${ma}">${uniqueKhoa[ma]}</option>`;
            });
        }

        function renderMH(page = 1) {
            currentPage = page;
            const search = document.getElementById('searchMH').value.toLowerCase().trim();
            const khoa = document.getElementById('khoaFilter').value;
            
            // Tiến hành lọc Realtime dữ liệu
            const filtered = allSubjectsData.filter(m => {
                const maMH = (m.MaMH || m.mamh || '').toLowerCase();
                const tenMH = (m.TenMH || m.tenmh || '').toLowerCase();
                const maKhoa = m.MaKhoa || m.makhoa || '';

                const matchSearch = tenMH.includes(search) || maMH.includes(search);
                const matchKhoa = !khoa || maKhoa === khoa;
                return matchSearch && matchKhoa;
            });

            const totalRows = filtered.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = filtered.slice(start, end);

            const tbody = document.getElementById('mhBody');
            if (totalRows === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted fw-medium">Không tìm thấy môn học nào phù hợp.</td></tr>';
                renderPagination(0, 0);
                return;
            }

            tbody.innerHTML = paginatedItems.map(m => {
                const codeMH = m.MaMH || m.mamh;
                const nameMH = m.TenMH || m.tenmh;
                const credit = m.SoTinChi !== undefined ? m.SoTinChi : (m.sotinchi || 0);
                const nameKhoa = m.TenKhoa || m.tenkhoa || `Khoa ${m.MaKhoa}`;

                return `
                    <tr class="animate__animated animate__fadeIn" style="border-top: 1px solid #f1f5f9;">
                        <td class="ps-4 py-3 font-monospace fw-bold text-primary">${codeMH}</td>
                        <td class="fw-semibold text-dark">${nameMH}</td>
                        <td class="text-center fw-bold text-secondary" style="font-size: 1.05rem;">${credit}</td>
                        <td class="pe-4 text-muted fw-medium">${nameKhoa}</td>
                    </tr>
                `;
            }).join('');

            renderPagination(totalRows, totalPages);
        }

        function renderPagination(totalRows, totalPages) {
            let container = document.getElementById('paginationContainer');
            if (!container) {
                container = document.createElement('div'); container.id = 'paginationContainer';
                container.className = 'd-flex justify-content-end align-items-center mt-3 border-top pt-3';
                document.querySelector('.table-responsive').after(container);
            }
            if (totalRows === 0) { container.innerHTML = ''; return; }
            
            let html = '<nav><ul class="pagination pagination-sm mb-0 rounded-pill shadow-sm">';
            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link d-flex align-items-center justify-content-center" href="#" onclick="renderMH(${currentPage - 1}); return false;" style="width: 32px; height: 32px;"><span class="material-symbols-outlined" style="font-size: 18px; line-height: 1;">chevron_left</span></a></li>`;
            
            for(let i=1; i<=totalPages; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link d-flex align-items-center justify-content-center fw-medium" href="#" onclick="renderMH(${i}); return false;" style="width: 32px; height: 32px;">${i}</a></li>`;
            }
            
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link d-flex align-items-center justify-content-center" href="#" onclick="renderMH(${currentPage + 1}); return false;" style="width: 32px; height: 32px;"><span class="material-symbols-outlined" style="font-size: 18px; line-height: 1;">chevron_right</span></a></li>`;
            html += '</ul></nav>';
            container.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
