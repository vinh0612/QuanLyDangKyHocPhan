<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở lớp học phần - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title m-0">
                <span class="material-symbols-outlined text-primary" style="font-size: 32px;">add_home</span>
                Mở lớp học phần
            </h2>
            <button class="btn btn-primary d-flex align-items-center gap-2" onclick="openModal()">
                <span class="material-symbols-outlined" style="font-size: 20px;">add</span>
                Thêm lớp học phần
            </button>
        </div>

        <div class="card border-0 mb-4">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Lọc theo Học kỳ</label>
                    <select id="hkSelect" class="form-select" onchange="renderLHP()"></select>
                </div>
            </div>
        </div>

        <div class="card border-0">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Mã LHP</th>
                            <th>Môn học</th>
                            <th>Giáo viên</th>
                            <th>Lịch học</th>
                            <th>Phòng</th>
                            <th class="text-center">Sĩ số</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="lhpTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal fade" id="lhpModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="border-radius: 24px; border: none;">
                <div class="modal-header border-0 pt-4 px-4">
                    <h5 class="fw-bold" id="modalTitle">Thông tin lớp học phần</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4 pb-4">
                    <form id="lhpForm">
                        <input type="hidden" id="editMaLHP">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-600">Học kỳ</label>
                                <select id="formMaHK" class="form-select" required></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-600">Môn học</label>
                                <select id="formMaMH" class="form-select" required></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-600">Giáo viên</label>
                                <select id="formMaGV" class="form-select" required></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-600">Phòng học</label>
                                <input type="text" id="formPhong" class="form-control" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-600">Lịch học</label>
                                <input type="text" id="formLich" class="form-control" placeholder="Ví dụ: Thứ 2 (7-11)" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-600">Sĩ số tối đa</label>
                                <input type="number" id="formSiSo" class="form-control" min="1" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 px-4 pb-4">
                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Hủy bỏ</button>
                    <button type="button" class="btn btn-primary px-4" onclick="saveLHP()">Lưu lớp học</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['GiaoVu']);
        let lhpM;
        function init() {
            lhpM = new bootstrap.Modal(document.getElementById('lhpModal'));
            const hk = JSON.parse(localStorage.getItem('HocKy') || '[]'), mh = JSON.parse(localStorage.getItem('MonHoc') || '[]'), gv = JSON.parse(localStorage.getItem('GiaoVien') || '[]');
            document.getElementById('hkSelect').innerHTML = hk.map(h => `<option value="${h.MaHK}" ${h.DangMo ? 'selected' : ''}>${h.TenHK} (${h.NamHoc})</option>`).join('');
            document.getElementById('formMaHK').innerHTML = hk.map(h => `<option value="${h.MaHK}">${h.TenHK}</option>`).join('');
            document.getElementById('formMaMH').innerHTML = mh.map(m => `<option value="${m.MaMH}">${m.TenMH}</option>`).join('');
            document.getElementById('formMaGV').innerHTML = gv.map(g => `<option value="${g.MaGV}">${g.HoTen}</option>`).join('');
            renderLHP();
        }
        function renderLHP() {
            const hkid = document.getElementById('hkSelect').value, lhpD = JSON.parse(localStorage.getItem('LopHocPhan') || '[]'), mhD = JSON.parse(localStorage.getItem('MonHoc') || '[]'), gvD = JSON.parse(localStorage.getItem('GiaoVien') || '[]');
            document.getElementById('lhpTableBody').innerHTML = lhpD.filter(l => l.MaHK === hkid).map(l => `
                <tr>
                    <td><span class="fw-600">${l.MaLHP}</span></td>
                    <td>${(mhD.find(m => m.MaMH === l.MaMH) || {}).TenMH}</td>
                    <td>${(gvD.find(g => g.MaGV === l.MaGV) || {}).HoTen}</td>
                    <td>${l.LichHoc}</td>
                    <td><span class="badge bg-light text-dark border">${l.PhongHoc}</span></td>
                    <td class="text-center">${l.SiSoHienTai}/${l.SiSoToiDa}</td>
                    <td class="text-center">
                        <button class="btn btn-link btn-sm p-1" onclick="editLHP('${l.MaLHP}')"><span class="material-symbols-outlined text-accent">edit</span></button>
                        <button class="btn btn-link btn-sm p-1" onclick="deleteLHP('${l.MaLHP}', ${l.SiSoHienTai})"><span class="material-symbols-outlined text-danger">delete</span></button>
                    </td>
                </tr>
            `).join('');
        }
        window.openModal = () => { document.getElementById('modalTitle').innerText = 'Mở lớp học mới'; document.getElementById('lhpForm').reset(); document.getElementById('editMaLHP').value = ''; lhpM.show(); };
        window.editLHP = (id) => {
            const l = JSON.parse(localStorage.getItem('LopHocPhan') || '[]').find(x => x.MaLHP === id);
            if (!l) return;
            document.getElementById('modalTitle').innerText = 'Sửa lớp học: ' + id;
            document.getElementById('editMaLHP').value = id;
            ['MaHK', 'MaMH', 'MaGV'].forEach(k => document.getElementById('form' + k).value = l[k]);
            document.getElementById('formPhong').value = l.PhongHoc;
            document.getElementById('formLich').value = l.LichHoc;
            document.getElementById('formSiSo').value = l.SiSoToiDa;
            lhpM.show();
        };
        window.saveLHP = () => {
            const id = document.getElementById('editMaLHP').value, d = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            const obj = { MaLHP: id || 'LHP' + Date.now(), MaMH: document.getElementById('formMaMH').value, MaGV: document.getElementById('formMaGV').value, MaHK: document.getElementById('formMaHK').value, PhongHoc: document.getElementById('formPhong').value, LichHoc: document.getElementById('formLich').value, SiSoToiDa: parseInt(document.getElementById('formSiSo').value), SiSoHienTai: 0 };
            if (id) { const i = d.findIndex(x => x.MaLHP === id); obj.SiSoHienTai = d[i].SiSoHienTai; d[i] = obj; } else { d.push(obj); }
            localStorage.setItem('LopHocPhan', JSON.stringify(d)); lhpM.hide(); renderLHP();
        };
        window.deleteLHP = (id, s) => { if (s > 0) return alert('Không thể xóa lớp đã có SV!'); if (confirm('Xóa lớp này?')) { const d = JSON.parse(localStorage.getItem('LopHocPhan') || '[]').filter(x => x.MaLHP !== id); localStorage.setItem('LopHocPhan', JSON.stringify(d)); renderLHP(); } };
        init();
    </script>
</body>
</html>
