<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giảng dạy & Điểm - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

    <div id="main-wrapper">
        <aside class="sidebar" id="dynamicSidebar"></aside>

        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" placeholder="Tra cứu sinh viên, lớp học...">
            </div>
            
            <div class="nav-user">
                <div class="top-links d-none d-md-flex me-3">
                    <a href="dashboard.html" class="text-decoration-none text-main me-3">Trang chủ</a>
                    <a href="#" onclick="alert('Thông báo đang được cập nhật...')" class="text-decoration-none text-main">Thông báo</a>
                </div>
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=GV&background=0D8ABC&color=fff" alt="Avatar" class="avatar ms-2" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
            </div>
        </header>

        <main class="main-content">
            <h2 class="section-title mb-4">
                <span class="material-symbols-outlined text-primary" style="font-size: 32px;">menu_book</span>
                Quản lý Giảng dạy & Tra cứu Điểm
            </h2>

            <ul class="nav nav-pills mb-4 gap-2" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active shadow-sm" style="border-radius: 12px; font-weight: bold;" id="pills-lich-tab" data-bs-toggle="pill" data-bs-target="#pills-lich" type="button" role="tab">
                        <span class="material-symbols-outlined align-middle me-1" style="font-size: 18px;">event_note</span> Tra cứu Lịch dạy
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link shadow-sm" style="border-radius: 12px; font-weight: bold;" id="pills-diem-tab" data-bs-toggle="pill" data-bs-target="#pills-diem" type="button" role="tab">
                        <span class="material-symbols-outlined align-middle me-1" style="font-size: 18px;">grading</span> Tra cứu Điểm số
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">
                <div class="tab-pane fade show active animate__animated animate__fadeIn" id="pills-lich" role="tabpanel">
                    <div class="card border-0 mb-4 p-3 shadow-sm" style="border-radius: 16px;">
                        <div class="row g-3 align-items-center">
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-muted small">LỌC THEO GIẢNG VIÊN</label>
                                <select id="gvSelect" class="form-select border-light-subtle rounded-pill px-3 shadow-sm" onchange="renderLich()"></select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-muted small">LỌC THEO HỌC KỲ</label>
                                <select id="hkSelectLich" class="form-select border-light-subtle rounded-pill px-3 shadow-sm" onchange="renderLich()"></select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card border-0 p-3 shadow-sm" style="border-radius: 16px;">
                        <div class="table-responsive">
                            <table class="table align-middle table-custom table-hover m-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4 py-3">Môn học</th>
                                        <th>Mã LHP</th>
                                        <th>Lịch học</th>
                                        <th>Phòng học</th>
                                        <th class="text-center pe-4">Sĩ số hiện tại</th>
                                    </tr>
                                </thead>
                                <tbody id="lichBody"></tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-end align-items-center mt-3 border-top pt-3">
                            <nav><ul class="pagination pagination-sm mb-0 rounded-pill shadow-sm" id="paginationListLich"></ul></nav>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade animate__animated animate__fadeIn" id="pills-diem" role="tabpanel">
                    <div class="card border-0 mb-4 p-3 shadow-sm" style="border-radius: 16px;">
                        <div class="row g-3 align-items-center">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-muted small">CHỌN LỚP HỌC PHẦN TRA CỨU ĐIỂM</label>
                                <select id="lhpSelectDiem" class="form-select border-light-subtle rounded-pill px-3 shadow-sm" onchange="renderDiem()"></select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card border-0 p-3 shadow-sm" style="border-radius: 16px;">
                        <div class="table-responsive">
                            <table class="table align-middle table-custom text-center table-hover m-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="text-start ps-4 py-3">Mã SV</th>
                                        <th class="text-start">Họ và Tên Sinh viên</th>
                                        <th>Điểm Giữa kỳ</th>
                                        <th>Điểm Cuối kỳ</th>
                                        <th class="pe-4">Điểm Tổng kết</th>
                                    </tr>
                                </thead>
                                <tbody id="diemBody"></tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-end align-items-center mt-3 border-top pt-3">
                            <nav><ul class="pagination pagination-sm mb-0 rounded-pill shadow-sm" id="paginationListDiem"></ul></nav>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        Auth.checkAuth(['GiaoVu']);
        const user = Auth.getCurrentUser();

        let allLHPData = [];
        let allScoreData = [];
        let allGiangVien = [];
        let allHocKy = [];
        
        let currentPageLich = 1;
        let currentPageDiem = 1;
        const rowsPerPage = 6;

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            sidebar.innerHTML = `
                <div class="nav-brand text-start"><div style="color: var(--accent); font-size: 1.5rem;">EduManage</div><div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted); letter-spacing: normal;">Phòng Đào Tạo</div></div>
                <ul class="nav-menu">
                    <li><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                    <li><a href="mon-hoc.html"><span class="material-symbols-outlined menu-icon">book</span>Môn học</a></li>
                    <li><a href="mo-lop-hoc-phan.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Học kỳ & Mở lớp</a></li>
                    <li><a href="xem-danh-sach-dk.html"><span class="material-symbols-outlined menu-icon">how_to_reg</span>Danh sách đăng ký</a></li>
                    <li class="active"><a href="giang-day-diem.html"><span class="material-symbols-outlined menu-icon">menu_book</span>Giảng dạy & Điểm</a></li>
                </ul>
                <div style="padding: 1rem; margin-top: auto;">
                    <ul class="nav-menu" style="padding: 0;">
                        <li><a href="ho-so.html"><span class="material-symbols-outlined menu-icon">account_circle</span>Hồ sơ Cá nhân</a></li>
                        <li style="margin-top: 1rem;"><a href="#" onclick="Auth.logout()" style="color: #ef4444;"><span class="material-symbols-outlined menu-icon">logout</span>Đăng xuất</a></li>
                    </ul>
                </div>`;
        }

        async function init() {
            renderSidebar();

            let tenGiaoVu = user.name || "Giáo vụ";
            try {
                const profileRes = await Auth.fetchWithAuth('/GiaoVu/ho-so');
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    if (profileData.HoTen) tenGiaoVu = profileData.HoTen;
                }
            } catch(e) {}
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(tenGiaoVu)}&background=0D8ABC&color=fff`;

            try {
                // Kéo song song: Lớp học phần, Điểm toàn trường và Danh mục (GV, HK)
                const [resLHP, resDiem, resSupport] = await Promise.all([
                    Auth.fetchWithAuth('/GiaoVu/danh-sach-lop-hoc-phan'),
                    Auth.fetchWithAuth('/GiaoVu/tra-cuu-diem'),
                    Auth.fetchWithAuth('/GiaoVu/danh-muc-ho-tro')
                ]);

                if (resLHP.ok) allLHPData = await resLHP.json();
                if (resDiem.ok) allScoreData = await resDiem.json();
                if (resSupport.ok) {
                    const supportData = await resSupport.json();
                    allGiangVien = supportData.giangVien || [];
                    allHocKy = supportData.hocKy || [];
                }

                // Render Dropdown Bộ Lọc Lịch Dạy
                document.getElementById('gvSelect').innerHTML = '<option value="">-- Chọn Giảng viên --</option>' + 
                    allGiangVien.map(g => `<option value="${g.MaGV}">${g.HoTen} (${g.MaGV})</option>`).join('');
                
                document.getElementById('hkSelectLich').innerHTML = '<option value="">-- Tất cả Học kỳ --</option>' + 
                    allHocKy.map(h => `<option value="${h.MaHK}">${h.TenHK} - Năm học ${h.NamHoc}</option>`).join('');
                
                // Render Dropdown Lớp học phần bên Tab Điểm
                document.getElementById('lhpSelectDiem').innerHTML = '<option value="">-- Chọn Lớp học phần cần tra cứu --</option>' + 
                    allLHPData.map(l => `<option value="${l.MaLHP || l.malhp}">${l.MaLHP || l.malhp} - ${l.TenMH || l.tenmh} (${l.TenHK || l.tenhk})</option>`).join('');

                renderLich(1);
                renderDiem(1);
            } catch (err) {
                console.error("Lỗi khởi tạo màn hình Giảng dạy & Điểm:", err);
            }
        }

        // ================= TAB LỊCH DẠY =================
        function renderLich(page = 1) {
            currentPageLich = page;
            const hkId = document.getElementById('hkSelectLich').value;
            const gvId = document.getElementById('gvSelect').value;

            // Lọc dữ liệu lớp học phần theo Giáo viên và Học kỳ
            let filteredLich = allLHPData;
            if (gvId) filteredLich = filteredLich.filter(l => (l.MaGV || l.magv) === gvId);
            if (hkId) filteredLich = filteredLich.filter(l => (l.MaHK || l.mahk) === hkId);

            const totalRows = filteredLich.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            const start = (currentPageLich - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = filteredLich.slice(start, end);

            const tbody = document.getElementById('lichBody');
            if (totalRows === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted fw-medium">${gvId ? 'Giảng viên này không có lịch dạy' : 'Vui lòng chọn Giảng viên để xem lịch'}</td></tr>`;
                renderPagination('paginationListLich', 0, 0, currentPageLich, 'renderLich');
                return;
            }

            tbody.innerHTML = paginatedItems.map(lhp => {
                const tenMH = lhp.TenMH || lhp.tenmh || 'Môn học';
                const maLHP = lhp.MaLHP || lhp.malhp || '---';
                const sisoHT = lhp.SiSoHienTai !== undefined ? lhp.SiSoHienTai : 0;
                const sisoTD = lhp.SiSoToiDa !== undefined ? lhp.SiSoToiDa : 50;
                const isFull = sisoHT >= sisoTD;

                return `
                    <tr class="animate__animated animate__fadeIn" style="border-top: 1px solid #f1f5f9;">
                        <td class="ps-4 py-3"><div class="fw-bold text-dark">${tenMH}</div></td>
                        <td><span class="font-monospace fw-bold text-primary">${maLHP}</span></td>
                        <td class="text-muted fw-medium">${lhp.LichHoc || 'Chưa xếp'}</td>
                        <td><span class="badge bg-light text-dark border px-2 py-1">${lhp.PhongHoc || '---'}</span></td>
                        <td class="text-center pe-4">
                            <span class="badge ${isFull ? 'bg-danger-subtle text-danger' : 'bg-info-subtle text-info'} px-3 py-1.5 rounded-pill">
                                ${sisoHT} / ${sisoTD}
                            </span>
                        </td>
                    </tr>`;
            }).join('');

            renderPagination('paginationListLich', totalRows, totalPages, currentPageLich, 'renderLich');
        }

        // ================= TAB ĐIỂM SỐ =================
        function renderDiem(page = 1) {
            currentPageDiem = page;
            const lhpId = document.getElementById('lhpSelectDiem').value;
            const tbody = document.getElementById('diemBody');

            if (!lhpId) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted fw-medium">Vui lòng chọn một Lớp học phần ở trên để tra cứu điểm.</td></tr>';
                renderPagination('paginationListDiem', 0, 0, currentPageDiem, 'renderDiem');
                return;
            }

            const filteredScores = allScoreData.filter(d => (d.MaLHP || d.malhp) === lhpId);
            
            const totalRows = filteredScores.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            const start = (currentPageDiem - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = filteredScores.slice(start, end);

            if (totalRows === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted fw-medium">Lớp học phần này chưa có sinh viên đăng ký học.</td></tr>';
                renderPagination('paginationListDiem', 0, 0, currentPageDiem, 'renderDiem');
                return;
            }

            tbody.innerHTML = paginatedItems.map(diem => {
                const maSV = diem.MaSV || diem.masv;
                const tenSV = diem.TenSV || diem.tensv || 'Chưa cập nhật';
                
                // SQL Server trả về null hoặc giá trị thực
                const dGK = diem.DiemGiuaKy !== null && diem.DiemGiuaKy !== undefined ? diem.DiemGiuaKy : '---';
                const dCK = diem.DiemCuoiKy !== null && diem.DiemCuoiKy !== undefined ? diem.DiemCuoiKy : '---';
                const dTK = diem.DiemTongKet !== null && diem.DiemTongKet !== undefined ? diem.DiemTongKet : null;
                
                let tkBadgeHtml = '<span class="badge bg-light text-muted border px-2 py-1">Chưa nạp điểm</span>';
                if (dTK !== null) {
                    tkBadgeHtml = `<span class="badge ${dTK >= 4.0 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'} px-3 py-1.5 rounded-pill" style="font-size: 0.95rem;">${dTK.toFixed(1)}</span>`;
                }

                return `
                    <tr class="animate__animated animate__fadeIn" style="border-top: 1px solid #f1f5f9;">
                        <td class="text-start ps-4 py-3"><span class="fw-bold font-monospace text-primary">${maSV}</span></td>
                        <td class="text-start fw-medium text-dark">${tenSV}</td>
                        <td class="font-monospace fw-bold text-secondary">${dGK}</td>
                        <td class="font-monospace fw-bold text-secondary">${dCK}</td>
                        <td class="pe-4">${tkBadgeHtml}</td>
                    </tr>`;
            }).join('');

            renderPagination('paginationListDiem', totalRows, totalPages, currentPageDiem, 'renderDiem');
        }

        // Dùng chung một hàm vẽ Phân trang
        function renderPagination(listId, totalRows, totalPages, currentPage, functionName) {
            const paginationList = document.getElementById(listId);
            if (totalRows === 0) { paginationList.innerHTML = ''; return; }

            let html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link d-flex align-items-center justify-content-center" href="#" onclick="${functionName}(${currentPage - 1}); return false;" style="width: 32px; height: 32px;"><span class="material-symbols-outlined" style="font-size: 18px; line-height: 1;">chevron_left</span></a></li>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link d-flex align-items-center justify-content-center fw-medium" href="#" onclick="${functionName}(${i}); return false;" style="width: 32px; height: 32px;">${i}</a></li>`;
            }
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link d-flex align-items-center justify-content-center" href="#" onclick="${functionName}(${currentPage + 1}); return false;" style="width: 32px; height: 32px;"><span class="material-symbols-outlined" style="font-size: 18px; line-height: 1;">chevron_right</span></a></li>`;
            
            paginationList.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
