<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch dạy bộ môn - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        .gv-card { border-radius: 24px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 2rem; }
        .gv-card-header { background: #f8fafc; padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <h2 class="section-title">
            <span class="material-symbols-outlined text-primary" style="font-size: 32px;">view_agenda</span>
            Báo cáo lịch giảng dạy bộ môn
        </h2>

        <div class="card border-0 mb-4">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Chọn học kỳ</label>
                    <select id="hkSelect" class="form-select" onchange="renderS()"></select>
                </div>
            </div>
        </div>

        <div id="container"></div>
    </div>

    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['TruongBoMon']);
        const user = Auth.getCurrentUser();
        function init() {
            const h = JSON.parse(localStorage.getItem('HocKy') || '[]');
            document.getElementById('hkSelect').innerHTML = h.map(x => `<option value="${x.MaHK}" ${x.DangMo ? 'selected' : ''}>${x.TenHK}</option>`).join('');
            renderS();
        }
        function renderS() {
            const hkId = document.getElementById('hkSelect').value, lhpD = JSON.parse(localStorage.getItem('LopHocPhan') || '[]'), mhD = JSON.parse(localStorage.getItem('MonHoc') || '[]'), gvD = JSON.parse(localStorage.getItem('GiaoVien') || '[]');
            const me = gvD.find(g => g.MaGV === user.MaNguoiDung); if (!me) return;
            const teachers = gvD.filter(g => g.MaBoMon === me.MaBoMon);
            let html = '';
            teachers.forEach(g => {
                const classes = lhpD.filter(l => l.MaGV === g.MaGV && l.MaHK === hkId);
                html += `
                    <div class="gv-card bg-white animate__animated animate__fadeIn">
                        <div class="gv-card-header">
                            <span class="material-symbols-outlined text-accent">account_circle</span>
                            <h5 class="fw-bold mb-0">${g.HoTen} <small class="text-muted fw-normal ms-2">(${g.MaGV})</small></h5>
                        </div>
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead class="table-light">
                                    <tr><th class="ps-4">Tên môn học</th><th>Lịch học</th><th>Phòng</th><th class="text-center">Sĩ số</th></tr>
                                </thead>
                                <tbody>
                                    ${classes.length > 0 ? classes.map(l => `<tr><td class="ps-4 fw-600">${(mhD.find(m => m.MaMH === l.MaMH) || {}).TenMH}</td><td>${l.LichHoc}</td><td><span class="badge bg-light text-dark border">${l.PhongHoc}</span></td><td class="text-center">${l.SiSoHienTai}/${l.SiSoToiDa}</td></tr>`).join('') : '<tr><td colspan="4" class="text-center py-4 text-muted italic">Không có lịch dạy</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });
            document.getElementById('container').innerHTML = html;
        }
        init();
    </script>
</body>
</html>
