<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sĩ số Bộ môn - EduManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/truong-bo-mon.css">
</head>
<body>

    <div id="main-wrapper">
        <aside class="sidebar" id="dynamicSidebar">
            <!-- Dynamic Sidebar -->
        </aside>

        <!-- Main Content -->

            <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" placeholder="Tìm lớp học phần..." id="searchInput">
            </div>
            <div class="nav-user">
                <span class="me-3 fw-bold" id="deptName">Bộ môn: ...</span>
                <img id="userAvatar" src="" alt="Avatar" class="avatar">
            </div>
        </header>

        <main class="main-content">
            <div class="section-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Quản lý Giới hạn Sĩ số</h2>
                    <p class="text-muted">Điều chỉnh số lượng sinh viên tối đa cho từng lớp học phần.</p>
                </div>
                <div class="d-flex gap-2">
                    <select class="form-select rounded-pill border-0 shadow-sm" id="hkFilter" style="width: 200px;">
                        <!-- Dynamic -->
                    </select>
                </div>
            </div>

            <div class="tbm-card p-0" style="overflow: hidden;">
                <div class="table-responsive">
                    <table class="table tbm-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="ps-4">Mã LHP</th>
                                <th>Môn học</th>
                                <th>Giảng viên</th>
                                <th class="text-center">Sĩ số hiện tại</th>
                                <th style="width: 150px;" class="text-center">Sĩ số tối đa</th>
                                <th class="text-end pe-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="classTableBody">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        Auth.checkAuth(['TruongBoMon']);
        const user = Auth.getCurrentUser();

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            const path = window.location.pathname;
            const isPage = (p) => path.includes(p);

            sidebar.innerHTML = `
                <div class="nav-brand text-start px-4 py-4">
                    <div style="color: #3b82f6; font-size: 1.5rem; font-weight: 800;">EduManage</div>
                    <div style="font-size: 0.8rem; font-weight: 500; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Trưởng Bộ Môn</div>
                </div>
                <ul class="nav-menu list-unstyled px-2">
                    <li class="${isPage('dashboard.html') ? 'active' : ''}"><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                    <li class="${isPage('quan-ly-siso.html') ? 'active' : ''}"><a href="quan-ly-siso.html"><span class="material-symbols-outlined menu-icon">settings_applications</span>Quản lý Sĩ số</a></li>
                    <li class="${isPage('lich-day-bo-mon.html') ? 'active' : ''}"><a href="lich-day-bo-mon.html"><span class="material-symbols-outlined menu-icon">groups</span>Lịch dạy Bộ môn</a></li>
                    <li class="${isPage('nhap-diem.html') ? 'active' : ''}"><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                    <hr class="border-secondary opacity-25">
                    <li class="${isPage('lich-day.html') ? 'active' : ''}"><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy cá nhân</a></li>
                    <li class="${isPage('danh-sach-mon-hoc.html') ? 'active' : ''}"><a href="danh-sach-mon-hoc.html"><span class="material-symbols-outlined menu-icon">list_alt</span>Danh mục Môn học</a></li>
                </ul>
                <div class="sidebar-footer">
                    <ul class="nav-menu list-unstyled px-2">
                        <li class="${isPage('ho-so.html') ? 'active' : ''}"><a href="ho-so.html"><span class="material-symbols-outlined menu-icon">account_circle</span>Hồ sơ Cá nhân</a></li>
                        <li><a href="#" onclick="Auth.logout()" style="color: #ef4444;"><span class="material-symbols-outlined menu-icon">logout</span>Đăng xuất</a></li>
                    </ul>
                </div>
            `;
        }

        let currentPage = 1;
        const rowsPerPage = 7;
        let allClasses = []; // Biến toàn cục lưu danh sách lớp

        const getToken = () => {
            const userStr = localStorage.getItem('currentUser');
            return userStr ? JSON.parse(userStr).Token : null;
        };

        async function init() {
            renderSidebar();
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=TB&background=0D8ABC&color=fff`;
            // Tạm ẩn tên bộ môn cho đến khi có API load thông tin profile
            document.getElementById('deptName').innerText = `Bộ môn của bạn`; 

            const token = getToken();
            if (!token) return;

            try {
                // 1. Tải Học Kỳ đổ vào Dropdown
                const hkRes = await fetch('http://localhost:5123/api/TruongBoMon/hoc-ky', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (hkRes.ok) {
                    const hkData = await hkRes.json();
                    document.getElementById('hkFilter').innerHTML = hkData.map(h => 
                        `<option value="${h.MaHK}" ${h.DangMo ? 'selected' : ''}>${h.TenHK} - ${h.NamHoc}</option>`
                    ).join('');
                }

                // 2. Tải toàn bộ danh sách lớp của Bộ môn
                await loadClassesFromServer(token);

                // Gắn sự kiện lọc
                document.getElementById('hkFilter').onchange = () => { currentPage = 1; renderClasses(); };
                document.getElementById('searchInput').oninput = () => { currentPage = 1; renderClasses(); };

            } catch (error) {
                console.error("Lỗi khởi tạo:", error);
            }
        }

        async function loadClassesFromServer(token) {
            try {
                const res = await fetch('http://localhost:5123/api/TruongBoMon/lop-hoc-phan', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    allClasses = await res.json();
                    renderClasses();
                }
            } catch (err) {
                console.error("Lỗi fetch lớp học phần:", err);
            }
        }

        function renderClasses() {
            const hkId = document.getElementById('hkFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            
            // Lọc trên Frontend (Theo Học kỳ & Thanh tìm kiếm)
            const filtered = allClasses.filter(l => {
                const isCurrentHK = l.MaHK === hkId;
                const matchesSearch = !search || 
                                      l.MaLHP.toLowerCase().includes(search) || 
                                      (l.TenMH && l.TenMH.toLowerCase().includes(search)) || 
                                      (l.TenGV && l.TenGV.toLowerCase().includes(search));
                return isCurrentHK && matchesSearch;
            });

            // Phân trang
            const totalRows = filtered.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            const startIdx = (currentPage - 1) * rowsPerPage;
            const paginatedData = filtered.slice(startIdx, startIdx + rowsPerPage);

            const body = document.getElementById('classTableBody');
            if (totalRows === 0) {
                body.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">Không tìm thấy lớp học phần phù hợp</td></tr>';
                renderPagination(0, 0);
                return;
            }

            body.innerHTML = paginatedData.map(l => `
                <tr class="student-row animate__animated animate__fadeIn">
                    <td class="ps-4 fw-bold text-primary">${l.MaLHP}</td>
                    <td class="fw-bold">${l.TenMH}</td>
                    <td>${l.TenGV}</td>
                    <td class="text-center">
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2">${l.SiSoHienTai} sinh viên</span>
                    </td>
                   <td class="text-center">
                        <input type="number" 
                               class="grade-input border rounded text-center px-2 py-1 bg-light" 
                               style="width: 80px;" 
                               id="input-${l.MaLHP}" 
                               value="${l.SiSoToiDa}" 
                               min="${l.SiSoHienTai}"
                               onkeypress="return event.charCode >= 48 && event.charCode <= 57"> 
                    </td>
                    <td class="text-end pe-4">
                        <button class="btn btn-tbm btn-primary px-3 py-1 shadow-sm rounded-pill" style="font-size: 0.8rem;" onclick="updateCapacity('${l.MaLHP}', ${l.SiSoHienTai})">
                            <span class="material-symbols-outlined align-middle" style="font-size: 16px;">save</span> Lưu
                        </button>
                    </td>
                </tr>
            `).join('');

            renderPagination(totalRows, totalPages);
        }

        // Logic phân trang giữ nguyên của bro
        function renderPagination(totalRows, totalPages) {
            let container = document.getElementById('paginationContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'paginationContainer';
                container.className = 'pagination-container d-flex justify-content-between align-items-center py-3 px-4 bg-light border-top';
                document.querySelector('.tbm-card').appendChild(container);
            }
            if (totalRows === 0) { container.innerHTML = ''; return; }
            const start = (currentPage - 1) * rowsPerPage + 1;
            const end = Math.min(currentPage * rowsPerPage, totalRows);

            container.innerHTML = `
                <div class="pagination-info small text-muted">
                    Hiển thị <b class="text-dark">${start}-${end}</b> trong tổng số <b class="text-dark">${totalRows}</b> lớp học phần
                </div>
                <div class="pagination-nav d-flex gap-1">
                    <button class="btn btn-sm btn-white border" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><span class="material-symbols-outlined align-middle" style="font-size:18px;">chevron_left</span></button>
                    ${Array.from({length: totalPages}, (_, i) => i + 1).map(p => `<button class="btn btn-sm ${p === currentPage ? 'btn-primary' : 'btn-white border'}" onclick="changePage(${p})">${p}</button>`).join('')}
                    <button class="btn btn-sm btn-white border" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}><span class="material-symbols-outlined align-middle" style="font-size:18px;">chevron_right</span></button>
                </div>
            `;
        }

        window.changePage = (page) => { currentPage = page; renderClasses(); }

        // Bản API Cập nhật
        window.updateCapacity = async (maLHP, siSoHienTai) => {
            const input = document.getElementById(`input-${maLHP}`);
            const newVal = parseInt(input.value);
            
            if (isNaN(newVal) || newVal <= 0) {
                alert('Vui lòng nhập sĩ số là một số nguyên dương!');

                const oldData = allClasses.find(l => l.MaLHP === maLHP);
                if (oldData) input.value = oldData.SiSoToiDa;
                return;
            }

            if (newVal < siSoHienTai) {
                alert('Sĩ số tối đa không được nhỏ hơn số sinh viên đã đăng ký!');
                const oldData = allClasses.find(l => l.MaLHP === maLHP);
                if (oldData) input.value = oldData.SiSoToiDa;
                return;
            }
            
            const token = getToken();
            try {
                const res = await fetch('http://localhost:5123/api/TruongBoMon/cap-nhat-si-so', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ maLHP: maLHP, siSoToiDa: newVal })
                });

                const result = await res.json();
                if (res.ok) {
                    alert('🎉 ' + result.message);
                    // Cập nhật ngầm biến lưu trữ để khỏi tải lại trang
                    const classIdx = allClasses.findIndex(l => l.MaLHP === maLHP);
                    if(classIdx !== -1) allClasses[classIdx].SiSoToiDa = newVal;
                } else {
                    alert('❌ Lỗi: ' + result.message);
                }
            } catch (err) {
                alert('Lỗi kết nối máy chủ!');
            }
        };

        init();
    </script>
</body>
</html>
