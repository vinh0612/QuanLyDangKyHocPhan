<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ Cá nhân - Trưởng bộ môn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../GiaoVu/css/dashboard.css">
    <link rel="stylesheet" href="../GiangVien/css/giang-vien.css">
    <link rel="stylesheet" href="css/truong-bo-mon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>
    <div id="main-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="dynamicSidebar">
            <!-- Sidebar content will be rendered by JavaScript -->
        </aside>

        <!-- Main Content -->
        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" placeholder="Tra cứu thông tin...">
            </div>
            
            <div class="nav-user">
                <div class="top-links d-none d-md-flex">
                    <a href="dashboard.html">Trang chủ</a>
                    <a href="#">Thông báo</a>
                </div>
                <img id="userAvatar" src="" alt="Avatar" class="avatar ms-2">
            </div>
        </header>

        <main class="main-content">
            <div class="profile-header animate__animated animate__fadeIn">
                <div class="profile-avatar-lg" id="avatarLarge">TB</div>
                <div>
                    <h1 id="headerName" class="fw-bold mb-1">Họ và Tên</h1>
                    <div class="d-flex gap-3">
                        <span class="badge bg-white text-primary" id="displayRole">Trưởng Bộ Môn</span>
                        <span class="badge bg-white text-primary" id="headerID">GV001</span>
                    </div>
                </div>
            </div>

            <div class="card border-0 p-4 animate__animated animate__fadeInUp" style="border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
                    <span class="material-symbols-outlined text-primary">edit_note</span>
                    Thông tin chi tiết Trưởng Bộ Môn
                </h5>
                
                <form id="profileForm" class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Họ và tên</label>
                        <input type="text" id="hoTen" class="form-control bg-light" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Ngày sinh</label>
                        <input type="date" id="ngaySinh" class="form-control bg-light" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Bộ môn / Khoa</label>
                        <input type="text" id="donVi" class="form-control bg-light" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Số điện thoại</label>
                        <input type="text" id="sdt" class="form-control" placeholder="Nhập số điện thoại">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="example@school.edu.vn">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Địa chỉ hiện tại</label>
                        <textarea id="diaChi" class="form-control" rows="2" placeholder="Nhập địa chỉ cư trú"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Môn học có thể giảng dạy</label>
                        <textarea id="monDay" class="form-control" rows="2" placeholder="Ví dụ: Cơ sở dữ liệu, Lập trình Web..."></textarea>
                    </div>
                    
                    <div class="col-12 text-end mt-4">
                        <button type="submit" class="btn btn-primary px-5 py-2 rounded-pill shadow-sm">
                            <div class="d-flex align-items-center gap-2">
                                <span class="material-symbols-outlined">save</span>
                                CẬP NHẬT THÔNG TIN
                            </div>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        // Check Role
        Auth.checkAuth(['TruongBoMon']);
        const user = Auth.getCurrentUser();

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            const path = window.location.pathname;
            const isPage = (p) => path.includes(p);

            sidebar.innerHTML = `
                <div class="nav-brand text-start px-4 py-4">
                    <div style="color: #3b82f6; font-size: 1.5rem; font-weight: 800;">EduManage</div>
                    <div style="font-size: 0.8rem; font-weight: 500; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Trưởng Bộ Môn</div>
                </div>
                <ul class="nav-menu list-unstyled px-2">
                    <li class="${isPage('dashboard.html') ? 'active' : ''}"><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                    <li class="${isPage('quan-ly-siso.html') ? 'active' : ''}"><a href="quan-ly-siso.html"><span class="material-symbols-outlined menu-icon">settings_applications</span>Quản lý Sĩ số</a></li>
                    <li class="${isPage('lich-day-bo-mon.html') ? 'active' : ''}"><a href="lich-day-bo-mon.html"><span class="material-symbols-outlined menu-icon">groups</span>Lịch dạy Bộ môn</a></li>
                    <li class="${isPage('nhap-diem.html') ? 'active' : ''}"><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                    <hr class="border-secondary opacity-25">
                    <li class="${isPage('lich-day.html') ? 'active' : ''}"><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy cá nhân</a></li>
                    <li class="${isPage('danh-sach-mon-hoc.html') ? 'active' : ''}"><a href="danh-sach-mon-hoc.html"><span class="material-symbols-outlined menu-icon">list_alt</span>Danh mục Môn học</a></li>
                </ul>
                <div class="sidebar-footer">
                    <ul class="nav-menu list-unstyled px-2">
                        <li class="${isPage('ho-so.html') ? 'active' : ''}"><a href="ho-so.html"><span class="material-symbols-outlined menu-icon">account_circle</span>Hồ sơ Cá nhân</a></li>
                        <li><a href="#" onclick="Auth.logout()" style="color: #ef4444;"><span class="material-symbols-outlined menu-icon">logout</span>Đăng xuất</a></li>
                    </ul>
                </div>
            `;
        }

        const getToken = () => {
            const userStr = localStorage.getItem('currentUser');
            return userStr ? JSON.parse(userStr).Token : null;
        };

        // Tải hồ sơ từ SQL (Show full data)
        async function loadProfile() {
            const token = getToken();
            if (!token) return;

            try {
                const res = await fetch('http://localhost:5123/api/TruongBoMon/ho-so', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    
                    document.getElementById('hoTen').value = data.HoTen || '';
                    if (data.NgaySinh) {
                        document.getElementById('ngaySinh').value = data.NgaySinh.split('T')[0];
                    }
                    
                    // Đổ dữ liệu thật 100% không che đậy
                    document.getElementById('sdt').value = data.SoDT || '';
                    document.getElementById('email').value = data.Email || '';
                    document.getElementById('diaChi').value = data.DiaChi || '';
                    document.getElementById('donVi').value = `${data.TenBoMon || 'Chưa rõ'} - ${data.TenKhoa || 'Chưa rõ'}`;

                    // Cập nhật phần Header sinh động
                    document.getElementById('headerName').innerText = data.HoTen;
                    document.getElementById('headerID').innerText = data.MaGV;
                    
                    const initial = data.HoTen ? data.HoTen.charAt(0).toUpperCase() : 'TB';
                    document.getElementById('avatarLarge').innerText = initial;
                    document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${initial}&background=0D8ABC&color=fff`;
                }
            } catch (err) {
                console.error("Lỗi tải hồ sơ:", err);
            }
        }

        // Xử lý Cập nhật thông tin
        document.getElementById('profileForm').onsubmit = async (e) => {
            e.preventDefault();
            const token = getToken();
            if (!token) return;
            
            // Bốc thẳng data từ input gửi lên Backend
            const payload = {
                soDT: document.getElementById('sdt').value.trim(),
                email: document.getElementById('email').value.trim(),
                diaChi: document.getElementById('diaChi').value.trim()
            };
            
            try {
                const res = await fetch('http://localhost:5123/api/TruongBoMon/ho-so', {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();
                if (res.ok) {
                    alert(result.message);
                    loadProfile(); // Tải lại để cập nhật giao diện
                } else {
                    alert("Lỗi: " + result.message);
                }
            } catch (err) {
                console.error("Lỗi cập nhật:", err);
                alert("Không thể kết nối đến máy chủ!");
            }
        };

        renderSidebar();
        loadProfile();
    </script>
</body>
</html>
