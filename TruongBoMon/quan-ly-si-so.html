<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sĩ số - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        .edit-input { width: 100px; display: inline-block; font-weight: 700; color: var(--accent); }
    </style>
</head>
<body>

    <div class="container-fluid">
        <h2 class="section-title">
            <span class="material-symbols-outlined text-primary" style="font-size: 32px;">monitoring</span>
            Điều tiết sĩ số bộ môn
        </h2>

        <div class="card border-0 mb-4">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Lọc theo học kỳ</label>
                    <select id="hkSelect" class="form-select" onchange="renderC()"></select>
                </div>
            </div>
        </div>

        <div class="card border-0">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tên môn học</th>
                            <th>Giảng viên</th>
                            <th>Lịch học</th>
                            <th class="text-center">Sĩ số (Hiện tại / Tối đa)</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="cBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['TruongBoMon']);
        const user = Auth.getCurrentUser();
        function init() {
            const hk = JSON.parse(localStorage.getItem('HocKy') || '[]');
            document.getElementById('hkSelect').innerHTML = hk.map(h => `<option value="${h.MaHK}" ${h.DangMo ? 'selected' : ''}>${h.TenHK}</option>`).join('');
            renderC();
        }
        function renderC() {
            const hkId = document.getElementById('hkSelect').value, lhp = JSON.parse(localStorage.getItem('LopHocPhan') || '[]'), mh = JSON.parse(localStorage.getItem('MonHoc') || '[]'), gvD = JSON.parse(localStorage.getItem('GiaoVien') || '[]');
            const me = gvD.find(g => g.MaGV === user.MaNguoiDung); if (!me) return;
            const filtered = lhp.filter(l => { const gv = gvD.find(g => g.MaGV === l.MaGV); return l.MaHK === hkId && gv && gv.MaBoMon === me.MaBoMon; });
            document.getElementById('cBody').innerHTML = filtered.map(l => {
                const mon = mh.find(m => m.MaMH === l.MaMH) || {}, gv = gvD.find(g => g.MaGV === l.MaGV) || {};
                return `
                    <tr>
                        <td><span class="fw-bold">${mon.TenMH}</span></td>
                        <td>${gv.HoTen}</td>
                        <td>${l.LichHoc}</td>
                        <td class="text-center">
                            <span class="badge bg-light text-dark border">${l.SiSoHienTai}</span> / 
                            <span id="lb-${l.MaLHP}" class="fw-800 text-accent">${l.SiSoToiDa}</span>
                            <div id="eb-${l.MaLHP}" class="d-none"><input type="number" id="in-${l.MaLHP}" class="form-control form-control-sm edit-input" value="${l.SiSoToiDa}"></div>
                        </td>
                        <td class="text-center">
                            <button class="btn btn-link btn-sm p-1" id="be-${l.MaLHP}" onclick="enableE('${l.MaLHP}')"><span class="material-symbols-outlined text-accent">edit</span></button>
                            <button class="btn btn-link btn-sm p-1 d-none" id="bs-${l.MaLHP}" onclick="saveC('${l.MaLHP}', ${l.SiSoHienTai})"><span class="material-symbols-outlined text-success">save</span></button>
                        </td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="5" class="text-center py-4">Trống</td></tr>';
        }
        window.enableE = (id) => { document.getElementById('lb-'+id).classList.add('d-none'); document.getElementById('eb-'+id).classList.remove('d-none'); document.getElementById('be-'+id).classList.add('d-none'); document.getElementById('bs-'+id).classList.remove('d-none'); };
        window.saveC = (id, cur) => {
            const v = parseInt(document.getElementById('in-'+id).value); if (v < cur) return alert('Không thể nhỏ hơn số đã đăng ký!');
            const d = JSON.parse(localStorage.getItem('LopHocPhan') || '[]'); const i = d.findIndex(x => x.MaLHP === id);
            if (i !== -1) { d[i].SiSoToiDa = v; localStorage.setItem('LopHocPhan', JSON.stringify(d)); }
            renderC();
        };
        init();
    </script>
</body>
</html>
