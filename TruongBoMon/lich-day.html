<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch dạy cá nhân - Trưởng bộ môn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="css/truong-bo-mon.css">
</head>
<body>

    <div id="main-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="dynamicSidebar">
            <!-- Sidebar content will be rendered by JavaScript -->
        </aside>

        <!-- Main Content -->
        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" placeholder="Tìm kiếm lớp học...">
            </div>
            
            <div class="nav-user">
                <span class="me-3 fw-bold" id="deptName">Bộ môn: ...</span>
                <img id="userAvatar" src="" alt="Avatar" class="avatar">
            </div>
        </header>

        <main class="main-content">
            <h2 class="section-title mb-4">
                <span class="material-symbols-outlined text-primary" style="font-size: 32px;">calendar_month</span>
                Lịch giảng dạy chi tiết
            </h2>

            <div class="d-flex align-items-center gap-3 mb-4 p-3 bg-white shadow-sm" style="border-radius: 20px; width: fit-content;">
                <div class="d-flex align-items-center gap-2 px-3 border-end">
                    <span class="material-symbols-outlined text-primary">filter_list</span>
                    <span class="fw-bold text-dark">Chọn Học kỳ:</span>
                </div>
                <select id="hkSelect" class="form-select border-0 bg-transparent" style="width: 250px; font-weight: 600;" onchange="renderSchedule()"></select>
            </div>

            <div class="card border-0 p-3 animate__animated animate__fadeIn" style="border-radius: 16px;">
                <div class="table-responsive">
                    <table class="table align-middle table-custom">
                        <thead>
                            <tr>
                                <th>Môn học / Mã lớp</th>
                                <th>Lịch học</th>
                                <th>Phòng học</th>
                                <th class="text-center">Sĩ số hiện tại</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleBody"></tbody>
                    </table>
                </div>
                <div id="noData" class="text-center py-5 d-none">
                    <span class="material-symbols-outlined text-muted" style="font-size: 48px;">event_busy</span>
                    <div class="text-muted fs-5 mt-2">Không có lịch dạy trong học kỳ này</div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        // Check Role
        Auth.checkAuth(['TruongBoMon']);
        const user = Auth.getCurrentUser();

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            const path = window.location.pathname;
            const isPage = (p) => path.includes(p);

            sidebar.innerHTML = `
                <div class="nav-brand text-start px-4 py-4">
                    <div style="color: #3b82f6; font-size: 1.5rem; font-weight: 800;">EduManage</div>
                    <div style="font-size: 0.8rem; font-weight: 500; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Trưởng Bộ Môn</div>
                </div>
                <ul class="nav-menu list-unstyled px-2">
                    <li class="${isPage('dashboard.html') ? 'active' : ''}"><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                    <li class="${isPage('quan-ly-siso.html') ? 'active' : ''}"><a href="quan-ly-siso.html"><span class="material-symbols-outlined menu-icon">settings_applications</span>Quản lý Sĩ số</a></li>
                    <li class="${isPage('lich-day-bo-mon.html') ? 'active' : ''}"><a href="lich-day-bo-mon.html"><span class="material-symbols-outlined menu-icon">groups</span>Lịch dạy Bộ môn</a></li>
                    <li class="${isPage('nhap-diem.html') ? 'active' : ''}"><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                    <hr class="border-secondary opacity-25">
                    <li class="${isPage('lich-day.html') ? 'active' : ''}"><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy cá nhân</a></li>
                    <li class="${isPage('danh-sach-mon-hoc.html') ? 'active' : ''}"><a href="danh-sach-mon-hoc.html"><span class="material-symbols-outlined menu-icon">list_alt</span>Danh mục Môn học</a></li>
                </ul>
                <div class="sidebar-footer">
                    <ul class="nav-menu list-unstyled px-2">
                        <li class="${isPage('ho-so.html') ? 'active' : ''}"><a href="ho-so.html"><span class="material-symbols-outlined menu-icon">account_circle</span>Hồ sơ Cá nhân</a></li>
                        <li><a href="#" onclick="Auth.logout()" style="color: #ef4444;"><span class="material-symbols-outlined menu-icon">logout</span>Đăng xuất</a></li>
                    </ul>
                </div>
            `;
        }

        function init() {
            renderSidebar();
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=TB&background=0D8ABC&color=fff`;
            
            // Set Department Name
            const boMonData = JSON.parse(localStorage.getItem('BoMon') || '[]');
            const gvData = JSON.parse(localStorage.getItem('GiaoVien') || '[]');
            const myGV = gvData.find(g => g.MaGV === user.MaNguoiDung);
            if (myGV) {
                const myBM = boMonData.find(b => b.MaBoMon === myGV.MaBoMon);
                if (myBM) document.getElementById('deptName').innerText = `Bộ môn: ${myBM.TenBoMon}`;
            }

            const hks = JSON.parse(localStorage.getItem('HocKy') || '[]');
            document.getElementById('hkSelect').innerHTML = hks.map(hk => `<option value="${hk.MaHK}" ${hk.DangMo ? 'selected' : ''}>${hk.TenHK} - ${hk.NamHoc}</option>`).join('');

            renderSchedule();
        }

        function renderSchedule() {
            const hkId = document.getElementById('hkSelect').value;
            const lhpData = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            const mhData = JSON.parse(localStorage.getItem('MonHoc') || '[]');

            const myClasses = lhpData.filter(l => l.MaGV === user.MaNguoiDung && l.MaHK === hkId);
            const tbody = document.getElementById('scheduleBody');
            const noData = document.getElementById('noData');

            if (myClasses.length === 0) {
                tbody.innerHTML = '';
                noData.classList.remove('d-none');
                return;
            }

            noData.classList.add('d-none');
            tbody.innerHTML = myClasses.map(lhp => {
                const mon = mhData.find(m => m.MaMH === lhp.MaMH) || {};
                return `
                    <tr>
                        <td>
                            <div class="fw-bold text-accent">${mon.TenMH}</div>
                            <div class="small text-muted">Lớp: ${lhp.MaLHP}</div>
                        </td>
                        <td class="fw-500">${lhp.LichHoc}</td>
                        <td><span class="badge bg-light text-dark border">${lhp.PhongHoc}</span></td>
                        <td class="text-center">
                            <span class="badge ${lhp.SiSoHienTai >= lhp.SiSoToiDa ? 'bg-danger-subtle text-danger' : 'bg-info-subtle text-info'}">
                                ${lhp.SiSoHienTai} / ${lhp.SiSoToiDa}
                            </span>
                        </td>
                        <td class="text-center">
                            <a href="nhap-diem.html?malhp=${lhp.MaLHP}" class="btn btn-primary btn-sm rounded-pill px-3">Quản lý lớp</a>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        init();
    </script>
</body>
</html>
