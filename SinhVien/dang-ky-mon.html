<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký học phần - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="container-fluid">
        <h2 class="section-title">
            <span class="material-symbols-outlined text-primary" style="font-size: 32px;">edit_calendar</span>
            Đăng ký học phần
        </h2>
        
        <div class="card border-0 mb-5">
            <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
                <span class="material-symbols-outlined text-accent">campaign</span>
                Lớp học phần đang mở
            </h5>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Mã LHP</th>
                            <th>Môn học</th>
                            <th>Giảng viên</th>
                            <th>Lịch học</th>
                            <th class="text-center">Sĩ số</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="availableCourses"></tbody>
                </table>
            </div>
        </div>

        <div class="card border-0">
            <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
                <span class="material-symbols-outlined text-success">task_alt</span>
                Danh sách đã chọn
            </h5>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Tên môn học</th>
                            <th>Giảng viên</th>
                            <th>Lịch học</th>
                            <th class="text-center">Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="registeredCourses"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    
    <script>
        Auth.checkAuth(['SinhVien']);
        const user = Auth.getCurrentUser();

        function renderData() {
            const lhpData = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            const mhData = JSON.parse(localStorage.getItem('MonHoc') || '[]');
            const gvData = JSON.parse(localStorage.getItem('GiaoVien') || '[]');
            const hkData = JSON.parse(localStorage.getItem('HocKy') || '[]');
            const dkData = JSON.parse(localStorage.getItem('DangKyHoc') || '[]');

            const openSemesters = hkData.filter(hk => hk.DangMo === true).map(hk => hk.MaHK);
            const myDKs = dkData.filter(dk => dk.MaSV === user.MaNguoiDung && dk.TrangThai !== 'DaHuy');
            const myLHPIds = myDKs.map(dk => dk.MaLHP);

            // Available
            document.getElementById('availableCourses').innerHTML = lhpData
                .filter(lhp => openSemesters.includes(lhp.MaHK))
                .map(lhp => {
                    const mon = mhData.find(m => m.MaMH === lhp.MaMH) || {};
                    const gv = gvData.find(g => g.MaGV === lhp.MaGV) || {};
                    const isRegistered = myLHPIds.includes(lhp.MaLHP);
                    const alreadyHasThisCourse = myDKs.some(dk => {
                        const existingLHP = lhpData.find(l => l.MaLHP === dk.MaLHP);
                        return existingLHP && existingLHP.MaMH === lhp.MaMH;
                    });
                    const canReg = lhp.SiSoHienTai < lhp.SiSoToiDa && !alreadyHasThisCourse;
                    
                    return `
                        <tr>
                            <td><span class="fw-600">${lhp.MaLHP}</span></td>
                            <td>${mon.TenMH}</td>
                            <td>${gv.HoTen}</td>
                            <td>${lhp.LichHoc}</td>
                            <td class="text-center">
                                <span class="badge ${lhp.SiSoHienTai >= lhp.SiSoToiDa ? 'bg-danger-subtle text-danger' : 'bg-info-subtle text-info'}">
                                    ${lhp.SiSoHienTai}/${lhp.SiSoToiDa}
                                </span>
                            </td>
                            <td class="text-center">
                                <button class="btn btn-sm ${isRegistered ? 'btn-success' : (canReg ? 'btn-primary' : 'btn-secondary')}" 
                                    onclick="registerCourse('${lhp.MaLHP}')" ${!canReg || isRegistered ? 'disabled' : ''}>
                                    ${isRegistered ? 'Đã đăng ký' : 'Đăng ký'}
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

            // Registered
            document.getElementById('registeredCourses').innerHTML = dkData
                .filter(dk => dk.MaSV === user.MaNguoiDung)
                .map(dk => {
                    const lhp = lhpData.find(l => l.MaLHP === dk.MaLHP) || {};
                    const mon = mhData.find(m => m.MaMH === lhp.MaMH) || {};
                    const gv = gvData.find(g => g.MaGV === lhp.MaGV) || {};
                    const statusClass = dk.TrangThai === 'DaDangKy' ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger';

                    return `
                        <tr>
                            <td>${mon.TenMH}</td>
                            <td>${gv.HoTen}</td>
                            <td>${lhp.LichHoc}</td>
                            <td class="text-center"><span class="badge ${statusClass}">${dk.TrangThai}</span></td>
                            <td class="text-center">
                                ${dk.TrangThai === 'DaDangKy' ? `<button class="btn btn-outline-danger btn-sm" onclick="cancelRegistration('${dk.MaDK}')">Hủy</button>` : '-'}
                            </td>
                        </tr>
                    `;
                }).join('');
        }

        window.registerCourse = (maLHP) => {
            const dkData = JSON.parse(localStorage.getItem('DangKyHoc') || '[]');
            const lhpData = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            dkData.push({ MaDK: 'DK' + Date.now(), MaSV: user.MaNguoiDung, MaLHP: maLHP, NgayDK: new Date().toISOString().split('T')[0], TrangThai: 'DaDangKy' });
            const lhpIdx = lhpData.findIndex(l => l.MaLHP === maLHP);
            if (lhpIdx !== -1) lhpData[lhpIdx].SiSoHienTai++;
            localStorage.setItem('DangKyHoc', JSON.stringify(dkData));
            localStorage.setItem('LopHocPhan', JSON.stringify(lhpData));
            renderData();
        };

        window.cancelRegistration = (maDK) => {
            const dkData = JSON.parse(localStorage.getItem('DangKyHoc') || '[]');
            const lhpData = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            const dkIdx = dkData.findIndex(d => d.MaDK === maDK);
            if (dkIdx !== -1) {
                const maLHP = dkData[dkIdx].MaLHP;
                dkData[dkIdx].TrangThai = 'DaHuy';
                const lhpIdx = lhpData.findIndex(l => l.MaLHP === maLHP);
                if (lhpIdx !== -1) lhpData[lhpIdx].SiSoHienTai--;
            }
            localStorage.setItem('DangKyHoc', JSON.stringify(dkData));
            localStorage.setItem('LopHocPhan', JSON.stringify(lhpData));
            renderData();
        };

        renderData();
    </script>
</body>
</html>
