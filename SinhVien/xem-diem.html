<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả học tập - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        .gpa-card { background: linear-gradient(135deg, var(--accent), #60a5fa); color: white; padding: 2rem; border-radius: 24px; display: inline-block; min-width: 300px; box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.2); }
        .gpa-value { font-size: 3.5rem; font-weight: 800; line-height: 1; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <h2 class="section-title">
            <span class="material-symbols-outlined text-primary" style="font-size: 32px;">workspace_premium</span>
            Kết quả học tập chi tiết
        </h2>
        
        <div class="card border-0 mb-4">
            <div class="table-responsive">
                <table class="table align-middle text-center">
                    <thead>
                        <tr>
                            <th class="text-start ps-4">Học kỳ</th>
                            <th class="text-start">Tên môn học</th>
                            <th>Giảng viên</th>
                            <th>GK</th>
                            <th>CK</th>
                            <th>Tổng kết</th>
                        </tr>
                    </thead>
                    <tbody id="gradeTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="gpaContainer" class="text-end"></div>
    </div>

    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['SinhVien']);
        const user = Auth.getCurrentUser();

        function renderGrades() {
            const dkData = JSON.parse(localStorage.getItem('DangKyHoc') || '[]');
            const bdData = JSON.parse(localStorage.getItem('BangDiem') || '[]');
            const lhpData = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            const mhData = JSON.parse(localStorage.getItem('MonHoc') || '[]');
            const gvData = JSON.parse(localStorage.getItem('GiaoVien') || '[]');
            const hkData = JSON.parse(localStorage.getItem('HocKy') || '[]');

            const myDKs = dkData.filter(dk => dk.MaSV === user.MaNguoiDung && dk.TrangThai !== 'DaHuy');
            let totalTK = 0, countTK = 0;

            document.getElementById('gradeTableBody').innerHTML = myDKs.map(dk => {
                const lhp = lhpData.find(l => l.MaLHP === dk.MaLHP) || {};
                const mon = mhData.find(m => m.MaMH === lhp.MaMH) || {};
                const gv = gvData.find(g => g.MaGV === lhp.MaGV) || {};
                const hk = hkData.find(h => h.MaHK === lhp.MaHK) || {};
                const diem = bdData.find(b => b.MaDK === dk.MaDK);

                let tk = '-';
                if (diem) {
                    tk = diem.DiemTongKet;
                    totalTK += tk;
                    countTK++;
                }

                return `
                    <tr>
                        <td class="text-start ps-4">
                            <div class="fw-bold">${hk.TenHK}</div>
                            <div class="small text-muted">${hk.NamHoc}</div>
                        </td>
                        <td class="text-start fw-500">${mon.TenMH}</td>
                        <td>${gv.HoTen}</td>
                        <td>${diem ? diem.DiemGiuaKy : '-'}</td>
                        <td>${diem ? diem.DiemCuoiKy : '-'}</td>
                        <td>
                            <span class="badge ${tk !== '-' ? (tk >= 5 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger') : 'bg-light text-muted'}">
                                ${tk}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="6" class="py-5 text-muted">Chưa có kết quả học tập</td></tr>';

            if (countTK > 0) {
                const gpa = (totalTK / countTK).toFixed(2);
                document.getElementById('gpaContainer').innerHTML = `
                    <div class="gpa-card animate__animated animate__fadeInUp">
                        <div class="small text-uppercase opacity-75 fw-bold mb-1">Điểm trung bình (GPA)</div>
                        <div class="gpa-value">${gpa}</div>
                    </div>
                `;
            }
        }
        renderGrades();
    </script>
</body>
</html>
