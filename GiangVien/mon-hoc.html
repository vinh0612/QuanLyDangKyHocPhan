<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục Môn học - Giảng viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../GiaoVu/css/dashboard.css">
    <link rel="stylesheet" href="css/giang-vien.css">
</head>
<body>
    <div id="main-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="nav-brand text-start">
                <div style="color: var(--accent); font-size: 1.5rem;">EduManage</div>
                <div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted); letter-spacing: normal;">Hệ thống Đăng ký</div>
            </div>
            <ul class="nav-menu">
                <li>
                    <a href="dashboard.html">
                        <span class="material-symbols-outlined menu-icon">dashboard</span>
                        Tổng quan
                    </a>
                </li>
                <li>
                    <a href="lich-day.html">
                        <span class="material-symbols-outlined menu-icon">calendar_month</span>
                        Lịch dạy
                    </a>
                </li>
                <li>
                    <a href="nhap-diem.html">
                        <span class="material-symbols-outlined menu-icon">edit_square</span>
                        Quản lý Điểm
                    </a>
                </li>
                <li class="active">
                    <a href="mon-hoc.html">
                        <span class="material-symbols-outlined menu-icon">book</span>
                        Danh mục Môn
                    </a>
                </li>
            </ul>
            <div style="padding: 1rem;">
                <ul class="nav-menu" style="padding: 0;">
                    <li>
                        <a href="ho-so.html">
                            <span class="material-symbols-outlined menu-icon">account_circle</span>
                            Hồ sơ Cá nhân
                        </a>
                    </li>
                    <li style="margin-top: 1rem;">
                        <a href="#" onclick="Auth.logout()" style="color: #ef4444;">
                            <span class="material-symbols-outlined menu-icon">logout</span>
                            Đăng xuất
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" id="searchMH" placeholder="Tìm tên môn hoặc mã môn..." oninput="renderMH()">
            </div>
            
            <div class="nav-user">
                <div class="top-links d-none d-md-flex">
                    <a href="dashboard.html">Trang chủ</a>
                    <a href="#">Thông báo</a>
                </div>
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=Giang+Vien&background=0D8ABC&color=fff" alt="Avatar" class="avatar ms-2">
            </div>
        </header>

        <main class="main-content">
            <h2 class="section-title mb-4">
                <span class="material-symbols-outlined text-primary" style="font-size: 32px;">book</span>
                Danh mục Môn học đào tạo
            </h2>

            <div class="card border-0 mb-4 p-3" style="border-radius: 16px;">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Lọc theo Khoa</label>
                        <select id="khoaFilter" class="form-select" onchange="renderMH()">
                            <option value="">Tất cả các khoa</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card border-0 p-3" style="border-radius: 16px;">
                <div class="table-responsive">
                    <table class="table align-middle table-custom">
                        <thead>
                            <tr>
                                <th>Mã MH</th>
                                <th>Tên môn học</th>
                                <th class="text-center">Tín chỉ</th>
                                <th>Khoa quản lý</th>
                            </tr>
                        </thead>
                        <tbody id="mhBody"></tbody>
                    </table>
                </div>
                <!-- Pagination -->
                <div class="pagination-container">
                    <div class="pagination-info" id="paginationInfo"></div>
                    <nav>
                        <ul class="pagination" id="paginationList"></ul>
                    </nav>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        Auth.checkAuth(['GiangVien']);
        const user = Auth.getCurrentUser();
        
        let currentPage = 1;
        const rowsPerPage = 5;

        function init() {
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.HoTen)}&background=0D8ABC&color=fff`;
            
            const khoaD = JSON.parse(localStorage.getItem('Khoa') || '[]');
            document.getElementById('khoaFilter').innerHTML += khoaD.map(k => `<option value="${k.MaKhoa}">${k.TenKhoa}</option>`).join('');
            renderMH();
        }

        function renderMH(page = 1) {
            currentPage = page;
            const search = document.getElementById('searchMH').value.toLowerCase();
            const khoa = document.getElementById('khoaFilter').value;
            
            const mhD = JSON.parse(localStorage.getItem('MonHoc') || '[]');
            const khoaD = JSON.parse(localStorage.getItem('Khoa') || '[]');

            const filtered = mhD.filter(m => {
                const matchSearch = m.TenMH.toLowerCase().includes(search) || m.MaMH.toLowerCase().includes(search);
                const matchKhoa = !khoa || m.MaKhoa === khoa;
                return matchSearch && matchKhoa;
            });

            const totalRows = filtered.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = filtered.slice(start, end);

            document.getElementById('mhBody').innerHTML = paginatedItems.map(m => `
                <tr>
                    <td><span class="fw-bold">${m.MaMH}</span></td>
                    <td class="fw-500">${m.TenMH}</td>
                    <td class="text-center">${m.SoTinChi}</td>
                    <td>${(khoaD.find(k => k.MaKhoa === m.MaKhoa) || {}).TenKhoa}</td>
                </tr>
            `).join('') || '<tr><td colspan="4" class="text-center py-4">Không tìm thấy môn học phù hợp</td></tr>';

            renderPagination(totalRows, totalPages);
        }

        function renderPagination(totalRows, totalPages) {
            const paginationList = document.getElementById('paginationList');
            const paginationInfo = document.getElementById('paginationInfo');
            
            if (totalRows === 0) {
                paginationList.innerHTML = '';
                paginationInfo.innerText = '';
                return;
            }

            const start = (currentPage - 1) * rowsPerPage + 1;
            const end = Math.min(currentPage * rowsPerPage, totalRows);
            paginationInfo.innerText = `Hiển thị ${start}-${end} trong tổng số ${totalRows} môn học`;

            let html = '';
            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="renderMH(${currentPage - 1})"><span class="material-symbols-outlined">chevron_left</span></a></li>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="renderMH(${i})">${i}</a></li>`;
            }
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="renderMH(${currentPage + 1})"><span class="material-symbols-outlined">chevron_right</span></a></li>`;
            paginationList.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
