<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp phụ trách - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../GiaoVu/css/dashboard.css">
    <link rel="stylesheet" href="css/giang-vien.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        .class-item { cursor: pointer; border-radius: 16px; border: 1.5px solid var(--border); transition: 0.2s; background: #fff; margin-bottom: 1rem; }
        .class-item:hover { border-color: var(--accent); background: #f0f7ff; }
        .class-item.active { border-color: var(--accent); background: #eff6ff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1); }
        .table-custom-panel { border-radius: 16px; overflow: hidden; }
    </style>
</head>
<body>

    <div id="main-wrapper">
        <aside class="sidebar" id="dynamicSidebar"></aside>

        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" id="searchStudentInput" placeholder="Tìm nhanh sinh viên trong lớp..." oninput="searchStudents()">
            </div>
            <div class="nav-user">
                <div class="top-links d-none d-md-flex me-3">
                    <a href="dashboard.html" class="text-decoration-none text-main me-3">Trang chủ</a>
                    <a href="#" onclick="alert('Thông báo đang được cập nhật...')" class="text-decoration-none text-main">Thông báo</a>
                </div>
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=GV&background=0D8ABC&color=fff" alt="Avatar" class="avatar ms-2">
            </div>
        </header>

        <main class="main-content">
            <h2 class="section-title mb-4">
                <span class="material-symbols-outlined text-primary" style="font-size: 32px;">groups</span>
                Danh sách lớp phụ trách
            </h2>

            <div class="row g-4">
                <div class="col-lg-4 col-md-5">
                    <div id="classList" class="animate__animated animate__fadeInLeft">
                        <div class="text-center py-4 text-muted">Đang kết nối danh sách lớp phụ trách...</div>
                    </div>
                </div>
                
                <div class="col-lg-8 col-md-7">
                    <div id="studentPanel" class="card border-0 p-4 d-none animate__animated animate__fadeIn shadow-sm" style="border-radius: 20px;">
                        <h4 id="panelTitle" class="fw-bold mb-4">Danh sách sinh viên</h4>
                        <div class="table-responsive table-custom-panel">
                            <table class="table align-middle table-hover m-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4 py-3">Mã Sinh Viên</th>
                                        <th class="py-3">Họ và Tên</th>
                                        <th class="text-center py-3">Trạng Thái Học Vụ</th>
                                    </tr>
                                </thead>
                                <tbody id="studentBody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div id="emptyPanel" class="card border-0 text-center py-5 shadow-sm bg-white rounded-4">
                        <span class="material-symbols-outlined text-muted" style="font-size: 64px; opacity: 0.3;">touch_app</span>
                        <p class="text-muted mt-3 fs-5 fw-medium">Chọn một lớp học bên trái để xem danh sách sinh viên chi tiết</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../Assets/js/auth.js"></script>
    <script>
        Auth.checkAuth(['GiangVien','TruongBoMon','TruongKhoa']);
        const user = Auth.getCurrentUser();
        
        let allMyClasses = [];       // Lưu trữ danh sách lớp phụ trách
        let allStudentsData = [];    // Lưu trữ danh sách tất cả sinh viên có điểm/đăng ký lớp của GV
        let activeLHPId = "";        // Lưu mã lớp đang chọn để phục vụ tìm kiếm

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            const userRoleRaw = user.role ? user.role.toString().replace('role_', '').toLowerCase().trim() : '';

            if (userRoleRaw === 'truongbomon') {
                sidebar.innerHTML = `
                    <div class="nav-brand text-start"><div style="color: var(--accent); font-size: 1.5rem;">EduManage</div><div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);">Trưởng Bộ Môn</div></div>
                    <ul class="nav-menu">
                        <li><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                        <li><a href="../TruongBoMon/quan-ly-siso.html"><span class="material-symbols-outlined menu-icon">settings_applications</span>Quản lý Sĩ số</a></li>
                        <li><a href="../TruongBoMon/lich-day-bo-mon.html"><span class="material-symbols-outlined menu-icon">groups</span>Lịch dạy Bộ môn</a></li>
                        <li><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                        <li class="menu-divider" style="margin: 1rem 0; border-top: 1px solid #eee; opacity: 0.5;"></li>
                        <li><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy cá nhân</a></li>
                    </ul>`;
            } else {
                sidebar.innerHTML = `
                    <div class="nav-brand text-start"><div style="color: var(--accent); font-size: 1.5rem;">EduManage</div><div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);">Giảng viên</div></div>
                    <ul class="nav-menu">
                        <li><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                        <li><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy</a></li>
                        <li><a href="diem-danh.html"><span class="material-symbols-outlined menu-icon">how_to_reg</span>Điểm danh</a></li>
                        <li><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                        <li><a href="mon-hoc.html"><span class="material-symbols-outlined menu-icon">book</span>Danh mục Môn</a></li>
                    </ul>`;
            }
            sidebar.innerHTML += `<div style="padding: 1rem; margin-top: auto;"><ul class="nav-menu" style="padding: 0;"><li><a href="ho-so.html"><span class="material-symbols-outlined menu-icon">account_circle</span>Hồ sơ Cá nhân</a></li><li style="margin-top: 1rem;"><a href="#" onclick="Auth.logout()" style="color: #ef4444;"><span class="material-symbols-outlined menu-icon">logout</span>Đăng xuất</a></li></ul></div>`;
        }

        async function init() {
            renderSidebar();
            
            let tenGV = user.name || "GV";
            try {
                const profileRes = await Auth.fetchWithAuth('/GiangVien/ho-so');
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    if (profileData.HoTen) tenGV = profileData.HoTen;
                }
            } catch(e){}
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(tenGV)}&background=0D8ABC&color=fff`;

            await loadInitialData();
        }

        async function loadInitialData() {
            try {
                // Kích hoạt đồng thời 2 luồng tải dữ liệu từ CSDL
                const [resClasses, resStudents] = await Promise.all([
                    Auth.fetchWithAuth('/GiangVien/lop-phu-trach'),
                    Auth.fetchWithAuth('/GiangVien/diem-lop-minh')
                ]);

                if (resClasses.ok) allMyClasses = await resClasses.json();
                if (resStudents.ok) allStudentsData = await resStudents.json();

                renderClasses();
            } catch (err) {
                console.error("Lỗi nạp danh sách lớp phụ trách:", err);
            }
        }

        function renderClasses() {
            const listContainer = document.getElementById('classList');
            if (allMyClasses.length === 0) {
                listContainer.innerHTML = '<div class="card p-4 text-center text-muted rounded-4">Chưa có lớp học phần nào được phân công giảng dạy.</div>';
                return;
            }

            listContainer.innerHTML = allMyClasses.map(l => {
                const tenMH = l.TenMH || 'Môn học';
                const maLHP = l.MaLHP || '---';
                const tenHK = l.TenHK || 'Học kỳ';
                const namHoc = l.NamHoc || '';
                const siSo = lhp.SiSoHienTai !== undefined ? l.SiSoHienTai : 0;

                return `
                    <div class="class-item p-4 animate__animated animate__fadeIn" onclick="viewS('${maLHP}', '${tenMH}', this)">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="fw-bold mb-1 text-dark" style="font-size: 1rem;">${tenMH}</h6>
                                <div class="small text-muted fw-medium font-monospace mt-1">${maLHP} | ${tenHK} ${namHoc}</div>
                            </div>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1.5 fw-bold">${siSo} SV</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.viewS = (id, title, el) => {
            activeLHPId = id; // Lưu lại mã lớp phục vụ tìm kiếm realtime
            document.querySelectorAll('.class-item').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            
            document.getElementById('panelTitle').innerText = `Sinh viên lớp: ${title} (${id})`;
            document.getElementById('studentPanel').classList.remove('d-none');
            document.getElementById('emptyPanel').classList.add('d-none');

            // Lọc danh sách sinh viên thuộc lớp học phần này
            const classStudents = allStudentsData.filter(x => (x.MaLHP || x.malhp) === id);
            renderStudentListTable(classStudents);
        };

        function renderStudentListTable(students) {
            const tbody = document.getElementById('studentBody');
            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-5 text-muted fw-medium">Chưa có sinh viên nào đăng ký thành công vào lớp học phần này.</td></tr>';
                return;
            }

            tbody.innerHTML = students.map(d => {
                const maSv = d.MaSV || d.masv || '---';
                const tenSv = d.HoTen || d.hoten || 'Sinh viên ẩn';
                return `
                    <tr class="animate__animated animate__fadeIn" style="border-top: 1px solid #f1f5f9;">
                        <td class="ps-4 py-3 font-monospace fw-bold text-primary">${maSv}</td>
                        <td class="fw-medium text-dark">${tenSv}</td>
                        <td class="text-center">
                            <span class="badge bg-success-subtle text-success rounded-pill px-3 py-1.5 fw-bold">
                                Chính thức
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Tính năng tìm kiếm nhanh sinh viên theo tên hoặc mã số trực tiếp trên Header
        function searchStudents() {
            if (!activeLHPId) return;
            const keyword = document.getElementById('searchStudentInput').value.toLowerCase().trim();
            
            // Lấy danh sách gốc của lớp hiện tại
            const classStudents = allStudentsData.filter(x => (x.MaLHP || x.malhp) === activeLHPId);
            
            if (keyword) {
                const filtered = classStudents.filter(sv => {
                    const name = (sv.HoTen || '').toLowerCase();
                    const code = (sv.MaSV || '').toLowerCase();
                    return name.includes(keyword) || code.includes(keyword);
                });
                renderStudentListTable(filtered);
            } else {
                renderStudentListTable(classStudents);
            }
        }

        init();
    </script>
</body>
</html>
