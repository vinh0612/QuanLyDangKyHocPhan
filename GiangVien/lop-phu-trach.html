<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp phụ trách - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        .class-item { cursor: pointer; border-radius: 16px; border: 1.5px solid var(--border); transition: 0.2s; background: #fff; margin-bottom: 1rem; }
        .class-item:hover { border-color: var(--accent); background: #f0f7ff; }
        .class-item.active { border-color: var(--accent); background: #eff6ff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body>

    <div class="container-fluid">
        <h2 class="section-title">
            <span class="material-symbols-outlined text-primary" style="font-size: 32px;">groups</span>
            Danh sách lớp phụ trách
        </h2>

        <div class="row g-4">
            <div class="col-md-4">
                <div id="classList" class="animate__animated animate__fadeInLeft"></div>
            </div>
            
            <div class="col-md-8">
                <div id="studentPanel" class="card border-0 d-none animate__animated animate__fadeIn">
                    <h4 id="panelTitle" class="fw-bold mb-4">Danh sách sinh viên</h4>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Mã SV</th>
                                    <th>Họ tên</th>
                                    <th class="text-center">Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody id="studentBody"></tbody>
                        </table>
                    </div>
                </div>
                <div id="emptyPanel" class="card border-0 text-center py-5">
                    <span class="material-symbols-outlined text-muted" style="font-size: 64px;">touch_app</span>
                    <p class="text-muted mt-3 fs-5">Chọn một lớp học bên trái để xem chi tiết</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['GiangVien','TruongBoMon','TruongKhoa']);
        const user = Auth.getCurrentUser();

        function renderClasses() {
            const lhp = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            const mh = JSON.parse(localStorage.getItem('MonHoc') || '[]');
            const hk = JSON.parse(localStorage.getItem('HocKy') || '[]');

            document.getElementById('classList').innerHTML = lhp.filter(l => l.MaGV === user.MaNguoiDung).map(l => {
                const m = mh.find(x => x.MaMH === l.MaMH) || {};
                const h = hk.find(x => x.MaHK === l.MaHK) || {};
                return `
                    <div class="class-item p-4" onclick="viewS('${l.MaLHP}', '${m.TenMH}', this)">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="fw-bold mb-1">${m.TenMH}</h6>
                                <div class="small text-muted">${l.MaLHP} | ${h.TenHK}</div>
                            </div>
                            <span class="badge bg-primary-subtle text-primary">${l.SiSoHienTai} SV</span>
                        </div>
                    </div>
                `;
            }).join('') || '<p class="text-muted">Chưa có lớp phụ trách</p>';
        }

        window.viewS = (id, title, el) => {
            document.querySelectorAll('.class-item').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            
            const dk = JSON.parse(localStorage.getItem('DangKyHoc') || '[]').filter(x => x.MaLHP === id);
            const sv = JSON.parse(localStorage.getItem('SinhVien') || '[]');
            
            document.getElementById('panelTitle').innerText = `Sinh viên lớp: ${title}`;
            document.getElementById('studentPanel').classList.remove('d-none');
            document.getElementById('emptyPanel').classList.add('d-none');

            document.getElementById('studentBody').innerHTML = dk.map(d => {
                const s = sv.find(x => x.MaSV === d.MaSV) || {};
                return `
                    <tr>
                        <td><strong>${d.MaSV}</strong></td>
                        <td>${s.HoTen}</td>
                        <td class="text-center">
                            <span class="badge ${d.TrangThai === 'DaDangKy' ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">
                                ${d.TrangThai}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="3" class="text-center py-4">Trống</td></tr>';
        };

        renderClasses();
    </script>
</body>
</html>
