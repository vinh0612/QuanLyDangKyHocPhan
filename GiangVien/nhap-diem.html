<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Điểm - Giảng viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../GiaoVu/css/dashboard.css">
    <link rel="stylesheet" href="css/giang-vien.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

    <div id="main-wrapper">
        <aside class="sidebar" id="dynamicSidebar"></aside>

        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" placeholder="Tra cứu sinh viên..." oninput="filterStudents(this.value)">
            </div>
            <div class="nav-user">
                <div class="top-links d-none d-md-flex"><a href="dashboard.html">Trang chủ</a><a href="#">Thông báo</a></div>
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=GV&background=0D8ABC&color=fff" alt="Avatar" class="avatar ms-2">
            </div>
        </header>

        <main class="main-content">
            <h2 class="section-title mb-4">
                <span class="material-symbols-outlined text-primary" style="font-size: 32px;">edit_square</span> Quản lý Điểm & Lớp học
            </h2>

            <div class="card border-0 mb-4 p-3 shadow-sm" style="border-radius: 16px;">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small">CHỌN LỚP HỌC PHẦN PHỤ TRÁCH</label>
                        <select id="lhpSelect" class="form-select border-light-subtle rounded-pill px-3 shadow-sm" onchange="loadStudentGrades()">
                            <option value="">Đang tải danh sách lớp...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="gradePanel" class="card border-0 p-4 d-none animate__animated animate__fadeIn shadow-sm" style="border-radius: 20px;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold m-0" id="currentLHPTitle">Tên môn học</h4>
                        <p class="text-muted mb-0 mt-1" id="currentLHPSubtitle">Mã lớp: --- • Sĩ số: ---</p>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table align-middle text-center table-custom table-hover m-0">
                        <thead class="table-light">
                            <tr>
                                <th class="text-start ps-4">Sinh viên</th>
                                <th>Giữa kỳ (40%)</th>
                                <th>Cuối kỳ (60%)</th>
                                <th>Tổng kết</th>
                                <th>Kết quả</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="studentGradeBody"></tbody>
                    </table>
                </div>
                
                <div class="text-end mt-4 pt-3 border-top">
                    <button class="btn btn-primary px-5 py-2 rounded-pill shadow-sm fw-bold" onclick="saveAllGrades()" id="btnSave">
                        <div class="d-flex align-items-center gap-2"><span class="material-symbols-outlined">save</span> LƯU ĐIỂM XUỐNG HỆ THỐNG</div>
                    </button>
                </div>
            </div>

            <div id="emptyState" class="text-center py-5 bg-white shadow-sm border rounded-4 animate__animated animate__fadeIn">
                <span class="material-symbols-outlined text-muted" style="font-size: 64px; opacity: 0.3;">checklist</span>
                <p class="text-muted mt-3 fw-medium">Vui lòng chọn một lớp học phần ở trên để bắt đầu quản lý điểm.</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        Auth.checkAuth(['GiangVien', 'TruongBoMon']);
        const user = Auth.getCurrentUser();
        let myClasses = []; 
        let currentStudentList = []; 
        let filteredStudentList = [];

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            const userRoleRaw = user.role ? user.role.toString().replace('role_', '').toLowerCase().trim() : '';

            if (userRoleRaw === 'truongbomon') {
                sidebar.innerHTML = `
                    <div class="nav-brand text-start"><div style="color: var(--accent); font-size: 1.5rem;">EduManage</div><div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);">Trưởng Bộ Môn</div></div>
                    <ul class="nav-menu">
                        <li><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                        <li><a href="../TruongBoMon/quan-ly-siso.html"><span class="material-symbols-outlined menu-icon">settings_applications</span>Quản lý Sĩ số</a></li>
                        <li><a href="../TruongBoMon/lich-day-bo-mon.html"><span class="material-symbols-outlined menu-icon">groups</span>Lịch dạy Bộ môn</a></li>
                        <li class="active"><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                        <li class="menu-divider" style="margin: 1rem 0; border-top: 1px solid #eee; opacity: 0.5;"></li>
                        <li><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy cá nhân</a></li>
                    </ul>`;
            } else {
                sidebar.innerHTML = `
                    <div class="nav-brand text-start"><div style="color: var(--accent); font-size: 1.5rem;">EduManage</div><div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);">Giảng viên</div></div>
                    <ul class="nav-menu">
                        <li><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                        <li><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy</a></li>
                        <li><a href="diem-danh.html"><span class="material-symbols-outlined menu-icon">how_to_reg</span>Điểm danh</a></li>
                        <li class="active"><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                        <li><a href="mon-hoc.html"><span class="material-symbols-outlined menu-icon">book</span>Danh mục Môn</a></li>
                    </ul>`;
            }
            sidebar.innerHTML += `<div style="padding: 1rem; margin-top: auto;"><ul class="nav-menu" style="padding: 0;"><li><a href="ho-so.html"><span class="material-symbols-outlined menu-icon">account_circle</span>Hồ sơ Cá nhân</a></li><li style="margin-top: 1rem;"><a href="#" onclick="Auth.logout()" style="color: #ef4444;"><span class="material-symbols-outlined menu-icon">logout</span>Đăng xuất</a></li></ul></div>`;
        }

        async function init() {
            renderSidebar();
            
            let tenGV = user.name || "GV";
            try {
                const profileRes = await Auth.fetchWithAuth('/GiangVien/ho-so');
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    if (profileData.HoTen) tenGV = profileData.HoTen;
                }
            } catch(e){}
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(tenGV)}&background=0D8ABC&color=fff`;
            
            try {
                // ĐÃ SỬA CỔNG: Đồng bộ gọi cổng /lop-phu-trach để lấy đầy đủ thông tin tên môn học
                const res = await Auth.fetchWithAuth('/GiangVien/lop-phu-trach');
                if (res.ok) { myClasses = await res.json(); }
                const selectEl = document.getElementById('lhpSelect');
                if (myClasses.length === 0) { selectEl.innerHTML = '<option value="">Chưa được phân công lớp.</option>'; return; }

                selectEl.innerHTML = '<option value="">-- Chọn lớp học phần --</option>' + myClasses.map(l => `<option value="${l.MaLHP || l.malhp}">${l.MaLHP || l.malhp} - ${l.TenMH || l.tenmh}</option>`).join('');
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('malhp')) { selectEl.value = urlParams.get('malhp'); loadStudentGrades(); }
            } catch (err) { alert(err.message); }
        }

        async function loadStudentGrades() {
            const maLHP = document.getElementById('lhpSelect').value;
            const panel = document.getElementById('gradePanel'); const empty = document.getElementById('emptyState');
            if (!maLHP) { panel.classList.add('d-none'); empty.classList.remove('d-none'); return; }
            empty.classList.add('d-none'); panel.classList.remove('d-none');
            
            const currentClassInfo = myClasses.find(l => (l.MaLHP || l.malhp) === maLHP) || {};
            document.getElementById('currentLHPTitle').innerText = currentClassInfo.TenMH || currentClassInfo.tenmh || 'Môn học';
            document.getElementById('currentLHPSubtitle').innerText = `Mã LHP: ${maLHP} • Sĩ số: ${currentClassInfo.SiSoHienTai || 0} SV`;

            try {
                // ĐÃ SỬA CỔNG: Gọi cổng /diem-lop-minh và lọc theo lớp đang quản lý
                const res = await Auth.fetchWithAuth('/GiangVien/diem-lop-minh');
                if (res.ok) { 
                    const rawGrades = await res.json();
                    currentStudentList = rawGrades.filter(sv => (sv.MaLHP || sv.malhp) === maLHP);
                    filteredStudentList = [...currentStudentList]; 
                    renderStudentTable(); 
                }
            } catch (err) { alert("Lỗi nạp điểm học viên: " + err.message); }
        }

        function filterStudents(keyword) {
            keyword = keyword.toLowerCase().trim();
            filteredStudentList = currentStudentList.filter(sv => {
                return (sv.HoTen || sv.hoten || '').toLowerCase().includes(keyword) || (sv.MaSV || sv.masv || '').toLowerCase().includes(keyword);
            });
            renderStudentTable();
        }

        function renderStudentTable() {
            const tbody = document.getElementById('studentGradeBody');
            if (filteredStudentList.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="py-5 text-muted">Không tìm thấy sinh viên tương thích.</td></tr>'; return; }

            tbody.innerHTML = filteredStudentList.map(sv => {
                const maSv = sv.MaSV || sv.masv; 
                const tenSv = sv.HoTen || sv.hoten;
                const maDK = sv.MaDK || sv.madk; // Lấy khóa MaDK phục vụ Stored Procedure
                const diemGk = sv.DiemGiuaKy !== undefined ? sv.DiemGiuaKy : sv.diemgiuaky;
                const diemCk = sv.DiemCuoiKy !== undefined ? sv.DiemCuoiKy : sv.diemcuoiky;
                const diemTk = sv.DiemTongKet !== undefined ? sv.DiemTongKet : sv.diemtongket;

                let tkText = (diemTk !== null && diemTk !== undefined) ? diemTk.toFixed(1) : '';
                let statusHtml = (diemTk !== null && diemTk !== undefined) ? (diemTk >= 4.0 ? '<span class="badge bg-success-subtle text-success px-2 py-1">Đạt</span>' : '<span class="badge bg-danger-subtle text-danger px-2 py-1">Học lại</span>') : '<span class="badge bg-light text-muted border px-2 py-1">Chưa nhập</span>';

                // ĐẮP THÊM data-ma-dk VÀO THẺ tr ĐỂ TRUY XUẤT KHI LƯU
                return `
                    <tr class="student-row" data-ma-sv="${maSv}" data-ma-dk="${maDK}">
                        <td class="text-start ps-4"><div class="fw-bold text-dark">${tenSv}</div><div class="small text-muted font-monospace">${maSv}</div></td>
                        <td><input type="number" step="0.1" min="0" max="10" class="grade-input gk text-center rounded border-light-subtle" style="width: 70px;" value="${diemGk ?? ''}" oninput="calcDynamicGrade(this)"></td>
                        <td><input type="number" step="0.1" min="0" max="10" class="grade-input ck text-center rounded border-light-subtle" style="width: 70px;" value="${diemCk ?? ''}" oninput="calcDynamicGrade(this)"></td>
                        <td><input type="text" class="grade-input tk text-center fw-bold text-primary border-0 bg-transparent" style="width: 70px;" value="${tkText}" readonly></td>
                        <td class="status-cell">${statusHtml}</td>
                        <td><button class="btn btn-light btn-sm text-primary rounded-circle" onclick="focusRow(this)"><span class="material-symbols-outlined" style="font-size: 20px;">edit</span></button></td>
                    </tr>`;
            }).join('');
        }

        window.calcDynamicGrade = (inp) => {
            const tr = inp.closest('tr'); const gkVal = tr.querySelector('.gk').value; const ckVal = tr.querySelector('.ck').value;
            const tkInput = tr.querySelector('.tk'); const statusCell = tr.querySelector('.status-cell');
            if (gkVal !== '' && ckVal !== '') {
                const tk = (parseFloat(gkVal) * 0.4 + parseFloat(ckVal) * 0.6).toFixed(1); tkInput.value = tk;
                statusCell.innerHTML = tk >= 4.0 ? '<span class="badge bg-success-subtle text-success px-2 py-1">Đạt</span>' : '<span class="badge bg-danger-subtle text-danger px-2 py-1">Học lại sấy</span>';
            } else { tkInput.value = ''; statusCell.innerHTML = '<span class="badge bg-light text-muted border px-2 py-1">Chưa đủ điểm</span>'; }
        };

        window.focusRow = (btn) => { btn.closest('tr').querySelector('.gk').focus(); };

        // ĐÃ NÂNG CẤP ĐỈNH CAO: Bóc tách mảng bắn parallel Promises siêu tốc khớp Stored Procedure
        window.saveAllGrades = async () => {
            const maLHP = document.getElementById('lhpSelect').value; if (!maLHP) return;
            const btnSave = document.getElementById('btnSave'); btnSave.disabled = true;
            btnSave.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> ĐANG TIẾN HÀNH GHI AUDIT VẾT...';

            const requests = [];
            document.querySelectorAll('#studentGradeBody tr.student-row').forEach(tr => {
                const gkVal = tr.querySelector('.gk').value; 
                const ckVal = tr.querySelector('.ck').value;
                const maDK = tr.dataset.maDk; // Đọc trọn vẹn mã đăng ký học phần từ DOM

                // Chỉ bắn API lên những dòng nào được giảng viên điền/sửa điểm
                if (gkVal !== '' || ckVal !== '') {
                    requests.push(
                        Auth.fetchWithAuth('/GiangVien/nhap-diem', {
                            method: 'POST',
                            body: JSON.stringify({
                                maDK: maDK,
                                diemGiuaKy: gkVal !== '' ? parseFloat(gkVal) : null,
                                diemCuoiKy: ckVal !== '' ? parseFloat(ckVal) : null
                            })
                        })
                    );
                }
            });

            if (requests.length === 0) {
                alert("Không có thay đổi điểm số nào được phát hiện!");
                btnSave.disabled = false;
                btnSave.innerHTML = '<div class="d-flex align-items-center gap-2"><span class="material-symbols-outlined">save</span> LƯU ĐIỂM XUỐNG HỆ THỐNG</div>';
                return;
            }

            try {
                // Kích hoạt nổ súng đồng loạt các API
                const responses = await Promise.all(requests);
                const allOk = responses.every(r => r.ok);

                if (allOk) {
                    alert('Lưu điểm thành công! ');
                    await loadStudentGrades(); // Nạp lại bảng điểm realtime
                } else {
                    alert('Có một số dòng điểm ghi nhận thất bại do vi phạm ràng buộc bảo mật!');
                }
            } catch (err) { 
                alert('Lỗi kết nối máy chủ đường truyền!'); 
            } finally { 
                btnSave.disabled = false; 
                btnSave.innerHTML = '<div class="d-flex align-items-center gap-2"><span class="material-symbols-outlined">save</span> LƯU ĐIỂM XUỐNG HỆ THỐNG</div>'; 
            }
        };
        init();
    </script>
</body>
</html>
