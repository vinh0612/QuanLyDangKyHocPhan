<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập điểm - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        .grade-input { width: 70px; text-align: center; font-weight: 600; border-radius: 8px; }
        .tk-readonly { background: #f1f5f9 !important; border: none; font-weight: 800; color: var(--accent); }
    </style>
</head>
<body>

    <div class="container-fluid">
        <h2 class="section-title">
            <span class="material-symbols-outlined text-primary" style="font-size: 32px;">edit_square</span>
            Nhập điểm học phần
        </h2>

        <div class="card border-0 mb-4">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Lớp học phần (Học kỳ đã kết thúc)</label>
                    <select id="lhpSelect" class="form-select" onchange="loadStudentGrades()"></select>
                </div>
            </div>
        </div>

        <div id="gradePanel" class="card border-0 d-none animate__animated animate__fadeIn">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold m-0">Danh sách bảng điểm</h5>
                <button class="btn btn-outline-primary btn-sm" onclick="enableAllEditing()">Sửa tất cả</button>
            </div>
            
            <div class="table-responsive">
                <table class="table align-middle text-center">
                    <thead class="table-light">
                        <tr>
                            <th class="text-start ps-4">Sinh viên</th>
                            <th>Giữa kỳ (40%)</th>
                            <th>Cuối kỳ (60%)</th>
                            <th>Tổng kết</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="studentGradeBody"></tbody>
                </table>
            </div>
            <div class="text-end mt-4">
                <button class="btn btn-primary px-5" onclick="saveAllGrades()">LƯU TOÀN BỘ BẢNG ĐIỂM</button>
            </div>
        </div>
    </div>

    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['GiangVien','TruongBoMon','TruongKhoa']);
        const user = Auth.getCurrentUser();

        function init() {
            const lhpData = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            const hkData = JSON.parse(localStorage.getItem('HocKy') || '[]');
            const mhData = JSON.parse(localStorage.getItem('MonHoc') || '[]');

            const closedHKs = hkData.filter(hk => !hk.DangMo).map(h => h.MaHK);
            const myClasses = lhpData.filter(l => l.MaGV === user.MaNguoiDung && closedHKs.includes(l.MaHK));

            document.getElementById('lhpSelect').innerHTML = '<option value="">-- Chọn lớp --</option>' + 
                myClasses.map(l => `<option value="${l.MaLHP}">${l.MaLHP} - ${(mhData.find(m => m.MaMH === l.MaMH) || {}).TenMH}</option>`).join('');
        }

        function loadStudentGrades() {
            const maLHP = document.getElementById('lhpSelect').value;
            if (!maLHP) { document.getElementById('gradePanel').classList.add('d-none'); return; }

            const dkData = JSON.parse(localStorage.getItem('DangKyHoc') || '[]');
            const svData = JSON.parse(localStorage.getItem('SinhVien') || '[]');
            const bdData = JSON.parse(localStorage.getItem('BangDiem') || '[]');

            const regs = dkData.filter(dk => dk.MaLHP === maLHP && dk.TrangThai === 'DaDangKy');
            document.getElementById('studentGradeBody').innerHTML = regs.map(dk => {
                const sv = svData.find(s => s.MaSV === dk.MaSV) || {};
                const grade = bdData.find(b => b.MaDK === dk.MaDK) || {};
                const hasG = !!grade.MaBD;

                return `
                    <tr data-ma-dk="${dk.MaDK}">
                        <td class="text-start ps-4">
                            <div class="fw-bold">${sv.HoTen}</div>
                            <div class="small text-muted">${sv.MaSV}</div>
                        </td>
                        <td><input type="number" step="0.5" min="0" max="10" class="form-control form-control-sm grade-input mx-auto gk" value="${grade.DiemGiuaKy ?? ''}" ${hasG ? 'readonly' : ''} oninput="calc(this)"></td>
                        <td><input type="number" step="0.5" min="0" max="10" class="form-control form-control-sm grade-input mx-auto ck" value="${grade.DiemCuoiKy ?? ''}" ${hasG ? 'readonly' : ''} oninput="calc(this)"></td>
                        <td><input type="text" class="form-control form-control-sm grade-input mx-auto tk tk-readonly" value="${grade.DiemTongKet ?? ''}" readonly></td>
                        <td>${hasG ? `<button class="btn btn-link btn-sm p-0" onclick="enableRow(this)"><span class="material-symbols-outlined text-warning">edit</span></button>` : '<span class="text-muted small italic">Chưa nhập</span>'}</td>
                    </tr>
                `;
            }).join('');
            document.getElementById('gradePanel').classList.remove('d-none');
        }

        window.calc = (inp) => {
            const tr = inp.closest('tr');
            const gk = parseFloat(tr.querySelector('.gk').value) || 0;
            const ck = parseFloat(tr.querySelector('.ck').value) || 0;
            tr.querySelector('.tk').value = (gk * 0.4 + ck * 0.6).toFixed(2);
        };

        window.enableRow = (btn) => {
            const tr = btn.closest('tr');
            tr.querySelectorAll('.gk, .ck').forEach(i => i.readOnly = false);
            btn.parentElement.innerHTML = '<span class="material-symbols-outlined text-success">edit_note</span>';
        };

        window.enableAllEditing = () => document.querySelectorAll('.gk, .ck').forEach(i => i.readOnly = false);

        window.saveAllGrades = () => {
            const bdData = JSON.parse(localStorage.getItem('BangDiem') || '[]');
            document.querySelectorAll('#studentGradeBody tr').forEach(tr => {
                const maDK = tr.dataset.maDk, gk = parseFloat(tr.querySelector('.gk').value), ck = parseFloat(tr.querySelector('.ck').value), tk = parseFloat(tr.querySelector('.tk').value);
                if (!isNaN(gk) && !isNaN(ck)) {
                    const idx = bdData.findIndex(b => b.MaDK === maDK);
                    if (idx !== -1) { Object.assign(bdData[idx], { DiemGiuaKy: gk, DiemCuoiKy: ck, DiemTongKet: tk }); }
                    else { bdData.push({ MaBD: 'BD' + Date.now() + Math.random(), MaDK: maDK, DiemGiuaKy: gk, DiemCuoiKy: ck, DiemTongKet: tk }); }
                }
            });
            localStorage.setItem('BangDiem', JSON.stringify(bdData));
            alert('Lưu thành công!');
            loadStudentGrades();
        };

        init();
    </script>
</body>
</html>
