<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch dạy - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="container-fluid">
        <h2 class="section-title">
            <span class="material-symbols-outlined text-primary" style="font-size: 32px;">calendar_month</span>
            Lịch giảng dạy chi tiết
        </h2>

        <div class="card border-0 mb-4">
            <div class="row align-items-center">
                <div class="col-md-4" id="gvSelectContainer" style="display: none;">
                    <label class="form-label fw-bold">Chọn Giảng viên (Dành cho Giáo vụ)</label>
                    <select id="gvSelect" class="form-select" onchange="renderSchedule()"></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Chọn Học kỳ</label>
                    <select id="hkSelect" class="form-select" onchange="renderSchedule()"></select>
                </div>
            </div>
        </div>

        <div class="card border-0">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Tên môn học</th>
                            <th>Lịch học</th>
                            <th>Phòng học</th>
                            <th class="text-center">Sĩ số</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>
            <div id="noData" class="text-center py-5 d-none animate__animated animate__fadeIn">
                <span class="material-symbols-outlined text-muted" style="font-size: 48px;">event_busy</span>
                <div class="text-muted fs-5 mt-2">Không có lịch dạy trong giai đoạn này</div>
            </div>
        </div>
    </div>

    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['GiangVien','TruongBoMon','TruongKhoa','GiaoVu']);
        const user = Auth.getCurrentUser();

        function init() {
            const hks = JSON.parse(localStorage.getItem('HocKy') || '[]');
            document.getElementById('hkSelect').innerHTML = hks.map(hk => `<option value="${hk.MaHK}" ${hk.DangMo ? 'selected' : ''}>${hk.TenHK} - ${hk.NamHoc}</option>`).join('');

            if (user.Role === 'GiaoVu') {
                const gvs = JSON.parse(localStorage.getItem('GiaoVien') || '[]');
                document.getElementById('gvSelectContainer').style.display = 'block';
                document.getElementById('gvSelect').innerHTML = gvs.map(g => `<option value="${g.MaGV}">${g.HoTen}</option>`).join('');
            }

            renderSchedule();
        }

        function renderSchedule() {
            const hkId = document.getElementById('hkSelect').value;
            const targetGV = (user.Role === 'GiaoVu') ? document.getElementById('gvSelect').value : user.MaNguoiDung;
            
            const lhpData = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            const mhData = JSON.parse(localStorage.getItem('MonHoc') || '[]');

            const myClasses = lhpData.filter(l => l.MaGV === targetGV && l.MaHK === hkId);
            const tbody = document.getElementById('scheduleBody');
            const noData = document.getElementById('noData');

            if (myClasses.length === 0) {
                tbody.innerHTML = '';
                noData.classList.remove('d-none');
                return;
            }

            noData.classList.add('d-none');
            tbody.innerHTML = myClasses.map(lhp => {
                const mon = mhData.find(m => m.MaMH === lhp.MaMH) || {};
                return `
                    <tr>
                        <td class="ps-4">
                            <div class="fw-bold text-accent">${mon.TenMH}</div>
                            <div class="small text-muted">Mã lớp: ${lhp.MaLHP}</div>
                        </td>
                        <td>${lhp.LichHoc}</td>
                        <td><span class="badge bg-light text-dark border">${lhp.PhongHoc}</span></td>
                        <td class="text-center">
                            <span class="badge ${lhp.SiSoHienTai >= lhp.SiSoToiDa ? 'bg-danger-subtle text-danger' : 'bg-info-subtle text-info'}">
                                ${lhp.SiSoHienTai} / ${lhp.SiSoToiDa}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        init();
    </script>
</body>
</html>
