<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch dạy - Giảng viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../GiaoVu/css/dashboard.css">
    <link rel="stylesheet" href="css/giang-vien.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

    <div id="main-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="dynamicSidebar">
            <!-- Sidebar content will be rendered by JavaScript -->
        </aside>

        <!-- Main Content -->
        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" placeholder="Tìm kiếm lớp học...">
            </div>
            
            <div class="nav-user">
                <div class="top-links d-none d-md-flex">
                    <a href="dashboard.html">Trang chủ</a>
                    <a href="#">Thông báo</a>
                </div>
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=Giang+Vien&background=0D8ABC&color=fff" alt="Avatar" class="avatar ms-2">
            </div>
        </header>

        <main class="main-content">
            <h2 class="section-title mb-4">
                <span class="material-symbols-outlined text-primary" style="font-size: 32px;">calendar_month</span>
                Lịch giảng dạy chi tiết
            </h2>

            <div class="card border-0 mb-4 p-3" style="border-radius: 16px;">
                <div class="row align-items-center">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Chọn Học kỳ</label>
                        <select id="hkSelect" class="form-select" onchange="renderSchedule()"></select>
                    </div>
                </div>
            </div>

            <div class="card border-0 p-3 animate__animated animate__fadeIn" style="border-radius: 16px;">
                <div class="table-responsive">
                    <table class="table align-middle table-custom">
                        <thead>
                            <tr>
                                <th>Môn học / Mã lớp</th>
                                <th>Lịch học</th>
                                <th>Phòng học</th>
                                <th class="text-center">Sĩ số hiện tại</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleBody"></tbody>
                    </table>
                </div>
                <div id="noData" class="text-center py-5 d-none">
                    <span class="material-symbols-outlined text-muted" style="font-size: 48px;">event_busy</span>
                    <div class="text-muted fs-5 mt-2">Không có lịch dạy trong học kỳ này</div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        Auth.checkAuth(['GiangVien']);
        const user = Auth.getCurrentUser();

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            if (user.Role === 'TruongBoMon') {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = '../TruongBoMon/css/truong-bo-mon.css';
                document.head.appendChild(link);

                sidebar.innerHTML = `
                    <div class="nav-brand text-start">
                        <div style="color: var(--accent); font-size: 1.5rem;">EduManage</div>
                        <div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted); letter-spacing: normal;">Trưởng Bộ Môn</div>
                    </div>
                    <ul class="nav-menu">
                        <li><a href="../TruongBoMon/dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                        <li><a href="../TruongBoMon/quan-ly-siso.html"><span class="material-symbols-outlined menu-icon">settings_applications</span>Quản lý Sĩ số</a></li>
                        <li><a href="../TruongBoMon/lich-day-bo-mon.html"><span class="material-symbols-outlined menu-icon">groups</span>Lịch dạy Bộ môn</a></li>
                        <li><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                        <li class="menu-divider" style="margin: 1rem 0; border-top: 1px solid #eee; opacity: 0.5;"></li>
                        <li class="active"><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy cá nhân</a></li>
                    </ul>
                `;
            } else {
                sidebar.innerHTML = `
                    <div class="nav-brand text-start">
                        <div style="color: var(--accent); font-size: 1.5rem;">EduManage</div>
                        <div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted); letter-spacing: normal;">Giảng viên</div>
                    </div>
                    <ul class="nav-menu">
                        <li><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                        <li class="active"><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy</a></li>
                        <li><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                        <li><a href="mon-hoc.html"><span class="material-symbols-outlined menu-icon">book</span>Danh mục Môn</a></li>
                    </ul>
                `;
            }
            sidebar.innerHTML += `
                <div style="padding: 1rem; margin-top: auto;">
                    <ul class="nav-menu" style="padding: 0;">
                        <li><a href="ho-so.html"><span class="material-symbols-outlined menu-icon">account_circle</span>Hồ sơ Cá nhân</a></li>
                        <li style="margin-top: 1rem;"><a href="#" onclick="Auth.logout()" style="color: #ef4444;"><span class="material-symbols-outlined menu-icon">logout</span>Đăng xuất</a></li>
                    </ul>
                </div>
            `;
        }

        let currentPage = 1;
        const rowsPerPage = 5;
        let allMyClasses = [];

        function init() {
            renderSidebar();
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.HoTen)}&background=0D8ABC&color=fff`;
            
            const hks = JSON.parse(localStorage.getItem('HocKy') || '[]');
            document.getElementById('hkSelect').innerHTML = hks.map(hk => `<option value="${hk.MaHK}" ${hk.DangMo ? 'selected' : ''}>${hk.TenHK} - ${hk.NamHoc}</option>`).join('');

            renderSchedule();
        }

        function renderSchedule() {
            const hkId = document.getElementById('hkSelect').value;
            const lhpData = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            
            allMyClasses = lhpData.filter(l => l.MaGV === user.MaNguoiDung && l.MaHK === hkId);
            currentPage = 1;
            renderScheduleTable();
        }

        function renderScheduleTable() {
            const mhData = JSON.parse(localStorage.getItem('MonHoc') || '[]');
            const tbody = document.getElementById('scheduleBody');
            const noData = document.getElementById('noData');

            // Pagination Logic
            const totalRows = allMyClasses.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            const startIdx = (currentPage - 1) * rowsPerPage;
            const paginatedData = allMyClasses.slice(startIdx, startIdx + rowsPerPage);

            if (totalRows === 0) {
                tbody.innerHTML = '';
                noData.classList.remove('d-none');
                renderPagination(0, 0);
                return;
            }

            noData.classList.add('d-none');
            tbody.innerHTML = paginatedData.map(lhp => {
                const mon = mhData.find(m => m.MaMH === lhp.MaMH) || {};
                return `
                    <tr>
                        <td class="text-start ps-4">
                            <div class="fw-bold text-accent">${mon.TenMH}</div>
                            <div class="small text-muted">Lớp: ${lhp.MaLHP}</div>
                        </td>
                        <td class="fw-500">${lhp.LichHoc}</td>
                        <td><span class="badge bg-light text-dark border">${lhp.PhongHoc}</span></td>
                        <td class="text-center">
                            <span class="badge ${lhp.SiSoHienTai >= lhp.SiSoToiDa ? 'bg-danger-subtle text-danger' : 'bg-info-subtle text-info'}">
                                ${lhp.SiSoHienTai} / ${lhp.SiSoToiDa}
                            </span>
                        </td>
                        <td class="text-center">
                            <a href="nhap-diem.html?malhp=${lhp.MaLHP}" class="btn btn-primary btn-sm rounded-pill px-3">Quản lý lớp</a>
                        </td>
                    </tr>
                `;
            }).join('');

            renderPagination(totalRows, totalPages);
        }

        function renderPagination(totalRows, totalPages) {
            let container = document.getElementById('paginationContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'paginationContainer';
                container.className = 'pagination-container mt-3';
                document.querySelector('.table-responsive').after(container);
            }

            if (totalRows === 0) {
                container.innerHTML = '';
                return;
            }

            const start = (currentPage - 1) * rowsPerPage + 1;
            const end = Math.min(currentPage * rowsPerPage, totalRows);

            container.innerHTML = `
                <div class="pagination-info">
                    Hiển thị <b>${start}-${end}</b> trong tổng số <b>${totalRows}</b> lớp học
                </div>
                <div class="pagination-nav">
                    <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    ${Array.from({length: totalPages}, (_, i) => i + 1).map(p => `
                        <button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>
                    `).join('')}
                    <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            `;
        }

        function changePage(page) {
            currentPage = page;
            renderScheduleTable();
        }
        init();
    </script>
</body>
</html>
