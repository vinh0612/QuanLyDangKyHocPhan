<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch dạy - Giảng viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../GiaoVu/css/dashboard.css">
    <link rel="stylesheet" href="css/giang-vien.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

    <div id="main-wrapper">
        <aside class="sidebar" id="dynamicSidebar"></aside>

        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" id="tableSearchInput" placeholder="Tìm kiếm tên môn, mã lớp..." oninput="searchTable()">
            </div>
            <div class="nav-user">
                <div class="top-links d-none d-md-flex me-3">
                    <a href="dashboard.html" class="text-decoration-none text-main me-3">Trang chủ</a>
                    <a href="#" onclick="alert('Thông báo đang được cập nhật...')" class="text-decoration-none text-main">Thông báo</a>
                </div>
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=GV&background=0D8ABC&color=fff" alt="Avatar" class="avatar ms-2">
            </div>
        </header>

        <main class="main-content">
            <h2 class="section-title mb-4">
                <span class="material-symbols-outlined text-primary" style="font-size: 32px;">calendar_month</span>
                Lịch giảng dạy chi tiết
            </h2>

            <div class="card border-0 mb-4 p-3 shadow-sm" style="border-radius: 16px;">
                <div class="row align-items-center">
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-muted small">CHỌN HỌC KỲ TRA CỨU</label>
                        <select id="hkSelect" class="form-select border-light-subtle rounded-pill px-3 shadow-sm" onchange="renderSchedule()">
                            <option value="">Đang truy xuất dữ liệu...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card border-0 p-3 shadow-sm animate__animated animate__fadeIn" style="border-radius: 16px;">
                <div class="table-responsive">
                    <table class="table align-middle table-custom table-hover m-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 py-3">Môn học / Mã lớp</th>
                                <th>Lịch học</th>
                                <th>Phòng học</th>
                                <th class="text-center">Sĩ số hiện tại</th>
                                <th class="text-center pe-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleBody">
                            <tr><td colspan="5" class="text-center py-5 text-muted">Đang kết nối hệ thống máy chủ...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="noData" class="text-center py-5 d-none bg-white rounded-4">
                    <span class="material-symbols-outlined text-muted" style="font-size: 64px; opacity: 0.3;">event_busy</span>
                    <div class="text-muted fs-5 mt-3 fw-medium">Không có lịch dạy trong học kỳ này</div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        Auth.checkAuth(['GiangVien', 'TruongBoMon']);
        const user = Auth.getCurrentUser();

        let allMyClasses = [];
        let filteredClasses = [];
        let allHocKy = [];
        let currentPage = 1;
        const rowsPerPage = 6;

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            const userRoleRaw = user.role ? user.role.toString().replace('role_', '').toLowerCase().trim() : '';

            if (userRoleRaw === 'truongbomon') {
                const link = document.createElement('link');
                link.rel = 'stylesheet'; link.href = '../TruongBoMon/css/truong-bo-mon.css';
                document.head.appendChild(link);
                sidebar.innerHTML = `
                    <div class="nav-brand text-start"><div style="color: var(--accent); font-size: 1.5rem;">EduManage</div><div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);">Trưởng Bộ Môn</div></div>
                    <ul class="nav-menu">
                        <li><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                        <li><a href="../TruongBoMon/quan-ly-siso.html"><span class="material-symbols-outlined menu-icon">settings_applications</span>Quản lý Sĩ số</a></li>
                        <li><a href="../TruongBoMon/lich-day-bo-mon.html"><span class="material-symbols-outlined menu-icon">groups</span>Lịch dạy Bộ môn</a></li>
                        <li><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                        <li class="menu-divider" style="margin: 1rem 0; border-top: 1px solid #eee; opacity: 0.5;"></li>
                        <li class="active"><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy cá nhân</a></li>
                    </ul>`;
            } else {
                sidebar.innerHTML = `
                    <div class="nav-brand text-start"><div style="color: var(--accent); font-size: 1.5rem;">EduManage</div><div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);">Giảng viên</div></div>
                    <ul class="nav-menu">
                        <li><a href="dashboard.html"><span class="material-symbols-outlined menu-icon">dashboard</span>Tổng quan</a></li>
                        <li class="active"><a href="lich-day.html"><span class="material-symbols-outlined menu-icon">calendar_month</span>Lịch dạy</a></li>
                        <li><a href="diem-danh.html"><span class="material-symbols-outlined menu-icon">how_to_reg</span>Điểm danh</a></li>
                        <li><a href="nhap-diem.html"><span class="material-symbols-outlined menu-icon">edit_square</span>Quản lý Điểm</a></li>
                        <li><a href="mon-hoc.html"><span class="material-symbols-outlined menu-icon">book</span>Danh mục Môn</a></li>
                    </ul>`;
            }
            sidebar.innerHTML += `<div style="padding: 1rem; margin-top: auto;"><ul class="nav-menu" style="padding: 0;"><li><a href="ho-so.html"><span class="material-symbols-outlined menu-icon">account_circle</span>Hồ sơ Cá nhân</a></li><li style="margin-top: 1rem;"><a href="#" onclick="Auth.logout()" style="color: #ef4444;"><span class="material-symbols-outlined menu-icon">logout</span>Đăng xuất</a></li></ul></div>`;
        }

        async function init() {
            renderSidebar();
            
            try {
                let tenHienThi = user.name || "GV";
                try {
                    const profileRes = await Auth.fetchWithAuth('/GiangVien/ho-so');
                    if (profileRes.ok) {
                        const profileData = await profileRes.json();
                        if (profileData.HoTen) tenHienThi = profileData.HoTen;
                    }
                } catch (e) {}
                document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(tenHienThi)}&background=0D8ABC&color=fff`;

                // 🌟 FIX LỖI HỌC KỲ: Tải song song cả danh sách Lớp và danh sách Học Kỳ
                const [classRes, hkRes] = await Promise.all([
                    Auth.fetchWithAuth('/GiangVien/lop-phu-trach'),
                    Auth.fetchWithAuth('/GiangVien/hoc-ky') // API lấy full học kỳ
                ]);

                if (classRes.ok) allMyClasses = await classRes.json();
                if (hkRes.ok) allHocKy = await hkRes.json();
                
                populateSemesterFilter();
                renderSchedule();
            } catch (err) { 
                alert("Lỗi tải lịch giảng dạy chi tiết: " + err.message); 
            }
        }

        function populateSemesterFilter() {
            const select = document.getElementById('hkSelect');
            select.disabled = false;
            
            if (!allHocKy || allHocKy.length === 0) {
                select.innerHTML = '<option value="">-- Tất cả học kỳ --</option><option value="none" disabled>🚫 Lỗi tải Học kỳ</option>';
                return;
            }

            // 🌟 Đổ data thật từ bảng HocKy và tự động trỏ vào Học Kỳ Hiện Tại (LaHKHienTai = 1)
            select.innerHTML = '<option value="">-- Tất cả học kỳ --</option>' + 
                allHocKy.map(hk => {
                    const isCurrent = hk.LaHKHienTai || hk.lahkhientai ? 'selected' : '';
                    return `<option value="${hk.MaHK || hk.mahk}" ${isCurrent}>${hk.TenHK || hk.tenhk} - Năm học ${hk.NamHoc || hk.namhoc}</option>`;
                }).join('');
        }

        function renderSchedule() {
            const selectedHK = document.getElementById('hkSelect').value;
            
            // Lọc theo Mã Học Kỳ chuẩn xác thay vì cắt chuỗi
            if (selectedHK !== "") {
                filteredClasses = allMyClasses.filter(item => (item.MaHK || item.mahk) === selectedHK);
            } else { 
                filteredClasses = [...allMyClasses]; 
            }
            currentPage = 1;
            renderScheduleTable();
        }

        function searchTable() {
            const keyword = (document.getElementById('tableSearchInput').value || '').toLowerCase().trim();
            const selectedHK = document.getElementById('hkSelect').value;
            
            let baseData = [...allMyClasses];
            if (selectedHK !== "") {
                baseData = allMyClasses.filter(item => (item.MaHK || item.mahk) === selectedHK);
            }

            if (keyword) {
                filteredClasses = baseData.filter(item => {
                    const name = (item.TenMH || '').toLowerCase();
                    const code = (item.MaLHP || '').toLowerCase();
                    return name.includes(keyword) || code.includes(keyword);
                });
            } else {
                filteredClasses = baseData;
            }
            currentPage = 1;
            renderScheduleTable();
        }

        function renderScheduleTable() {
            const tbody = document.getElementById('scheduleBody');
            const noData = document.getElementById('noData');
            const totalRows = filteredClasses.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            const paginatedData = filteredClasses.slice((currentPage - 1) * rowsPerPage, currentPage * rowsPerPage);

            if (totalRows === 0) {
                tbody.innerHTML = ''; noData.classList.remove('d-none'); renderPagination(0, 0); return;
            }
            noData.classList.add('d-none');
            tbody.innerHTML = paginatedData.map(lhp => {
                const textMH = lhp.TenMH || 'Môn học';
                const codeLHP = lhp.MaLHP || '---';
                const scheduleString = lhp.LichHoc || 'Chưa xếp lịch';
                const roomString = lhp.PhongHoc || '---';
                const currSV = lhp.SiSoHienTai !== undefined ? lhp.SiSoHienTai : 0;
                const maxSV = lhp.SiSoToiDa !== undefined ? lhp.SiSoToiDa : 50;

                return `
                    <tr class="animate__animated animate__fadeIn">
                        <td class="text-start ps-4 py-3">
                            <div class="fw-bold text-primary mb-1" style="font-size: 1.05rem;">${textMH}</div>
                            <div class="small text-muted fw-medium">Lớp: ${codeLHP}</div>
                        </td>
                        <td class="fw-bold text-dark">${scheduleString}</td>
                        <td><span class="badge bg-light text-dark border px-2 py-1">${roomString}</span></td>
                        <td class="text-center"><span class="badge bg-info-subtle text-info px-3 py-1 rounded-pill">${currSV} / ${maxSV}</span></td>
                        <td class="text-center pe-4"><a href="nhap-diem.html?malhp=${codeLHP}" class="btn btn-primary btn-sm rounded-pill px-4 shadow-sm fw-medium">Quản lý lớp</a></td>
                    </tr>`;
            }).join('');
            renderPagination(totalRows, totalPages);
        }

        function renderPagination(totalRows, totalPages) {
            let container = document.getElementById('paginationContainer');
            if (!container) {
                container = document.createElement('div'); 
                container.id = 'paginationContainer';
                // ĐÃ FIX: Dùng justify-content-end để đẩy thẳng cụm phân trang sang bên phải
                container.className = 'd-flex justify-content-end align-items-center mt-3 border-top pt-3';
                document.querySelector('.table-responsive').after(container);
            }
            if (totalRows === 0) { container.innerHTML = ''; return; }
            
            let html = '<nav><ul class="pagination pagination-sm mb-0 rounded-pill shadow-sm">';
            
            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link d-flex align-items-center justify-content-center" href="#" onclick="changePage(${currentPage - 1}); return false;" style="width: 32px; height: 32px;">
                            <span class="material-symbols-outlined" style="font-size: 18px; line-height: 1;">chevron_left</span>
                        </a>
                     </li>`;
            
            for(let i=1; i<=totalPages; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link d-flex align-items-center justify-content-center fw-medium" href="#" onclick="changePage(${i}); return false;" style="width: 32px; height: 32px;">${i}</a>
                         </li>`;
            }
            
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link d-flex align-items-center justify-content-center" href="#" onclick="changePage(${currentPage + 1}); return false;" style="width: 32px; height: 32px;">
                            <span class="material-symbols-outlined" style="font-size: 18px; line-height: 1;">chevron_right</span>
                        </a>
                     </li>`;
                     
            html += '</ul></nav>';
            container.innerHTML = html;
        }

        window.changePage = (page) => { currentPage = page; renderScheduleTable(); };
        init();
    </script>
</body>
</html>
