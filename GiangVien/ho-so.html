<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ Cá nhân - Giảng viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../GiaoVu/css/dashboard.css">
    <link rel="stylesheet" href="css/giang-vien.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>
    <div id="main-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="nav-brand text-start">
                <div style="color: var(--accent); font-size: 1.5rem;">EduManage</div>
                <div style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted); letter-spacing: normal;">Hệ thống Đăng ký</div>
            </div>
            <ul class="nav-menu">
                <li>
                    <a href="dashboard.html">
                        <span class="material-symbols-outlined menu-icon">dashboard</span>
                        Tổng quan
                    </a>
                </li>
                <li>
                    <a href="lich-day.html">
                        <span class="material-symbols-outlined menu-icon">calendar_month</span>
                        Lịch dạy
                    </a>
                </li>
                <li>
                    <a href="nhap-diem.html">
                        <span class="material-symbols-outlined menu-icon">edit_square</span>
                        Quản lý Điểm
                    </a>
                </li>
                <li>
                    <a href="mon-hoc.html">
                        <span class="material-symbols-outlined menu-icon">book</span>
                        Danh mục Môn
                    </a>
                </li>
            </ul>
            <div style="padding: 1rem;">
                <ul class="nav-menu" style="padding: 0;">
                    <li class="active">
                        <a href="ho-so.html">
                            <span class="material-symbols-outlined menu-icon">account_circle</span>
                            Hồ sơ Cá nhân
                        </a>
                    </li>
                    <li style="margin-top: 1rem;">
                        <a href="#" onclick="Auth.logout()" style="color: #ef4444;">
                            <span class="material-symbols-outlined menu-icon">logout</span>
                            Đăng xuất
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-bar" placeholder="Tra cứu thông tin...">
            </div>
            
            <div class="nav-user">
                <div class="top-links d-none d-md-flex">
                    <a href="dashboard.html">Trang chủ</a>
                    <a href="#">Thông báo</a>
                </div>
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=Giang+Vien&background=0D8ABC&color=fff" alt="Avatar" class="avatar ms-2">
            </div>
        </header>

        <main class="main-content">
            <div class="profile-header animate__animated animate__fadeIn">
                <div class="profile-avatar-lg" id="avatarLarge">?</div>
                <div>
                    <h1 id="headerName" class="fw-bold mb-1">Họ và Tên</h1>
                    <div class="d-flex gap-3">
                        <span class="badge bg-white text-primary" id="displayRole">Giảng viên</span>
                        <span class="badge bg-white text-primary" id="headerID">GV001</span>
                    </div>
                </div>
            </div>

            <div class="card border-0 p-4 animate__animated animate__fadeInUp" style="border-radius: 24px;">
                <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
                    <span class="material-symbols-outlined text-accent">edit_note</span>
                    Thông tin chi tiết Giảng viên
                </h5>
                
                <form id="profileForm" class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Họ và tên</label>
                        <input type="text" id="hoTen" class="form-control bg-light" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Ngày sinh</label>
                        <input type="date" id="ngaySinh" class="form-control bg-light" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Bộ môn / Khoa</label>
                        <input type="text" id="donVi" class="form-control bg-light" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Số điện thoại</label>
                        <input type="text" id="sdt" class="form-control" placeholder="Nhập số điện thoại">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="example@school.edu.vn">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Địa chỉ hiện tại</label>
                        <textarea id="diaChi" class="form-control" rows="2" placeholder="Nhập địa chỉ cư trú"></textarea>
                    </div>
                    
                    <div class="col-12 text-end mt-4">
                        <button type="submit" class="btn btn-primary px-5 py-2 rounded-pill shadow-sm">
                            <div class="d-flex align-items-center gap-2">
                                <span class="material-symbols-outlined">save</span>
                                CẬP NHẬT THÔNG TIN
                            </div>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        Auth.checkAuth(['GiangVien']);
        const user = Auth.getCurrentUser();

        function loadProfile() {
            const gvD = JSON.parse(localStorage.getItem('GiaoVien') || '[]');
            const bmD = JSON.parse(localStorage.getItem('BoMon') || '[]');
            const kD = JSON.parse(localStorage.getItem('Khoa') || '[]');
            
            const data = gvD.find(g => g.MaGV === user.MaNguoiDung);

            if (data) {
                document.getElementById('hoTen').value = data.HoTen;
                document.getElementById('ngaySinh').value = data.NgaySinh || '';
                document.getElementById('sdt').value = data.SDT;
                document.getElementById('email').value = data.Email;
                document.getElementById('diaChi').value = data.DiaChi;
                
                const bm = bmD.find(b => b.MaBoMon === data.MaBoMon) || {};
                const khoa = kD.find(k => k.MaKhoa === data.MaKhoa) || {};
                document.getElementById('donVi').value = `${bm.TenBoMon || ''} - ${khoa.TenKhoa || ''}`;

                document.getElementById('headerName').innerText = data.HoTen;
                document.getElementById('headerID').innerText = data.MaGV;
                document.getElementById('displayRole').innerText = user.Role;
                document.getElementById('avatarLarge').innerText = data.HoTen.charAt(0);
                document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(data.HoTen)}&background=0D8ABC&color=fff`;
            }
        }

        document.getElementById('profileForm').onsubmit = (e) => {
            e.preventDefault();
            const gvD = JSON.parse(localStorage.getItem('GiaoVien') || '[]');
            const idx = gvD.findIndex(g => g.MaGV === user.MaNguoiDung);
            
            if (idx !== -1) {
                gvD[idx].SDT = document.getElementById('sdt').value;
                gvD[idx].Email = document.getElementById('email').value;
                gvD[idx].DiaChi = document.getElementById('diaChi').value;
                
                localStorage.setItem('GiaoVien', JSON.stringify(gvD));
                alert('Đã cập nhật hồ sơ cá nhân thành công!');
                loadProfile();
            }
        };

        loadProfile();
    </script>
</body>
</html>
