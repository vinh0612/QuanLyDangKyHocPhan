<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục môn học - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="container-fluid">
        <h2 class="section-title">
            <span class="material-symbols-outlined text-primary" style="font-size: 32px;">auto_stories</span>
            Danh mục môn học đào tạo
        </h2>

        <div class="card border-0 mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Tìm kiếm môn học</label>
                    <input type="text" id="searchMH" class="form-control" placeholder="Nhập tên hoặc mã môn..." oninput="renderMH()">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Lọc theo Khoa</label>
                    <select id="khoaFilter" class="form-select" onchange="renderMH()">
                        <option value="">Tất cả các khoa</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card border-0">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Mã MH</th>
                            <th>Tên môn học</th>
                            <th class="text-center">Tín chỉ</th>
                            <th>Khoa quản lý</th>
                        </tr>
                    </thead>
                    <tbody id="mhBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['GiangVien','TruongBoMon','TruongKhoa','GiaoVu']);
        
        function init() {
            const khoaD = JSON.parse(localStorage.getItem('Khoa') || '[]');
            document.getElementById('khoaFilter').innerHTML += khoaD.map(k => `<option value="${k.MaKhoa}">${k.TenKhoa}</option>`).join('');
            renderMH();
        }

        function renderMH() {
            const search = document.getElementById('searchMH').value.toLowerCase();
            const khoa = document.getElementById('khoaFilter').value;
            
            const mhD = JSON.parse(localStorage.getItem('MonHoc') || '[]');
            const khoaD = JSON.parse(localStorage.getItem('Khoa') || '[]');

            const filtered = mhD.filter(m => {
                const matchSearch = m.TenMH.toLowerCase().includes(search) || m.MaMH.toLowerCase().includes(search);
                const matchKhoa = !khoa || m.MaKhoa === khoa;
                return matchSearch && matchKhoa;
            });

            document.getElementById('mhBody').innerHTML = filtered.map(m => `
                <tr>
                    <td><span class="fw-bold">${m.MaMH}</span></td>
                    <td class="fw-500">${m.TenMH}</td>
                    <td class="text-center">${m.SoTinChi}</td>
                    <td>${(khoaD.find(k => k.MaKhoa === m.MaKhoa) || {}).TenKhoa}</td>
                </tr>
            `).join('') || '<tr><td colspan="4" class="text-center py-4">Không tìm thấy môn học phù hợp</td></tr>';
        }
        init();
    </script>
</body>
</html>
