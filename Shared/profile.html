<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        .profile-hero { background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 32px; padding: 3rem; color: #fff; margin-bottom: -3rem; position: relative; z-index: 1; }
        .profile-avatar { width: 100px; height: 100px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; border: 4px solid rgba(255,255,255,0.3); }
        .profile-card { padding-top: 5rem !important; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="profile-hero animate__animated animate__fadeInDown">
            <div class="d-flex align-items-center gap-4">
                <div class="profile-avatar" id="avatar">?</div>
                <div>
                    <h1 id="displayName" class="fw-bold mb-1">Họ và Tên</h1>
                    <div class="d-flex gap-3">
                        <span class="badge bg-white text-primary" id="displayRole">Vai trò</span>
                        <span class="badge bg-white text-primary" id="displayID">Mã số</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 profile-card">
            <form id="profileForm" class="row g-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Họ và tên</label>
                    <input type="text" id="hoTen" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Ngày sinh</label>
                    <input type="date" id="ngaySinh" class="form-control" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Số điện thoại</label>
                    <input type="text" id="sdt" class="form-control" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" id="email" class="form-control" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Đơn vị</label>
                    <input type="text" id="donVi" class="form-control" readonly>
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold">Địa chỉ cư trú</label>
                    <input type="text" id="diaChi" class="form-control" readonly>
                </div>
                
                <div class="col-12 text-end mt-5">
                    <button type="submit" id="btnSave" class="btn btn-primary px-5 py-2 d-none">
                        CẬP NHẬT THÔNG TIN
                    </button>
                </div>
            </form>
        </div>

        <!-- Section extra for Teachers: Possible Courses -->
        <div id="teacherExtra" class="card border-0 mt-4 d-none">
            <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
                <span class="material-symbols-outlined text-accent">workspace_premium</span>
                Năng lực giảng dạy
            </h5>
            <div class="row g-3" id="possibleCourses"></div>
        </div>
    </div>

    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['SinhVien','GiaoVu','GiangVien','TruongBoMon','TruongKhoa']);
        const user = Auth.getCurrentUser();
        const editable = ['GiangVien', 'TruongBoMon', 'TruongKhoa'].includes(user.Role);

        function loadProfile() {
            let data = null, table = '';
            if (user.Role === 'SinhVien') {
                table = 'SinhVien';
                data = JSON.parse(localStorage.getItem(table)).find(s => s.MaSV === user.MaNguoiDung);
                document.getElementById('donVi').value = data.MaKhoa;
            } else if (user.Role === 'GiaoVu') {
                table = 'GiaoVu';
                data = JSON.parse(localStorage.getItem(table)).find(g => g.MaGV_GV === user.MaNguoiDung);
                document.getElementById('donVi').value = 'Phòng Giáo vụ';
            } else {
                table = 'GiaoVien';
                data = JSON.parse(localStorage.getItem(table)).find(g => g.MaGV === user.MaNguoiDung);
                document.getElementById('donVi').value = data.MaBoMon;
                renderTeacherExtra();
            }

            if (data) {
                document.getElementById('hoTen').value = data.HoTen;
                document.getElementById('ngaySinh').value = data.NgaySinh || '';
                document.getElementById('sdt').value = data.SDT;
                document.getElementById('email').value = data.Email;
                document.getElementById('diaChi').value = data.DiaChi;
                
                document.getElementById('displayName').innerText = data.HoTen;
                document.getElementById('displayRole').innerText = user.Role;
                document.getElementById('displayID').innerText = user.MaNguoiDung;
                document.getElementById('avatar').innerText = data.HoTen.charAt(0);

                if (editable) {
                    ['sdt', 'email', 'diaChi'].forEach(id => document.getElementById(id).readOnly = false);
                    document.getElementById('btnSave').classList.remove('d-none');
                }
            }
        }

        function renderTeacherExtra() {
            document.getElementById('teacherExtra').classList.remove('d-none');
            const gvdm = JSON.parse(localStorage.getItem('GiaoVienDayMon') || '[]').filter(x => x.MaGV === user.MaNguoiDung);
            const mh = JSON.parse(localStorage.getItem('MonHoc') || '[]');
            document.getElementById('possibleCourses').innerHTML = gvdm.map(a => {
                const m = mh.find(x => x.MaMH === a.MaMH) || {};
                return `<div class="col-md-4"><div class="p-3 border rounded-4 bg-light fw-600 text-center">${m.TenMH}</div></div>`;
            }).join('') || '<p class="text-muted italic ps-3">Chưa có phân công môn dạy</p>';
        }

        document.getElementById('profileForm').onsubmit = (e) => {
            e.preventDefault();
            if (!editable) return;
            const table = 'GiaoVien', d = JSON.parse(localStorage.getItem(table));
            const i = d.findIndex(x => x.MaGV === user.MaNguoiDung);
            if (i !== -1) {
                d[i].SDT = document.getElementById('sdt').value;
                d[i].Email = document.getElementById('email').value;
                d[i].DiaChi = document.getElementById('diaChi').value;
                localStorage.setItem(table, JSON.stringify(d));
                alert('Đã lưu thành công!');
            }
        };

        loadProfile();
    </script>
</body>
</html>
