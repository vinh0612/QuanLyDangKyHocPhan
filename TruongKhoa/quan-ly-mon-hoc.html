<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý môn học - Hệ thống QL ĐKHP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        .nav-tabs { border: none; gap: 10px; }
        .nav-link { border: none !important; border-radius: 12px !important; font-weight: 600; color: var(--text-muted); padding: 0.8rem 1.5rem; }
        .nav-link.active { background: var(--accent) !important; color: #fff !important; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <h2 class="section-title">
            <span class="material-symbols-outlined text-primary" style="font-size: 32px;">menu_book</span>
            Quản trị môn học & Phân công
        </h2>

        <ul class="nav nav-tabs mb-4" id="deanTabs">
            <li class="nav-item">
                <button class="nav-link active d-flex align-items-center gap-2" data-bs-toggle="tab" data-bs-target="#coursesTab">
                    <span class="material-symbols-outlined" style="font-size: 20px;">library_books</span>
                    Danh mục môn học
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link d-flex align-items-center gap-2" data-bs-toggle="tab" data-bs-target="#assignTab">
                    <span class="material-symbols-outlined" style="font-size: 20px;">assignment_ind</span>
                    Phân công giảng dạy
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="coursesTab">
                <div class="card border-0">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold m-0">Môn học trong khoa</h5>
                        <button class="btn btn-primary btn-sm" onclick="openCourseModal()">+ Thêm môn học</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Mã MH</th>
                                    <th>Tên môn học</th>
                                    <th class="text-center">Tín chỉ</th>
                                    <th class="text-center">GV giảng dạy</th>
                                    <th class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="courseTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="assignTab">
                <div class="card border-0 mb-4">
                    <div class="row align-items-end g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Chọn môn học</label>
                            <select id="assignCourseSelect" class="form-select" onchange="renderAssignments()"></select>
                        </div>
                        <div class="col-md-6 text-end">
                            <button class="btn btn-outline-success btn-sm" id="btnAddAssign" onclick="openAssignModal()" disabled>+ Giao việc cho GV</button>
                        </div>
                    </div>
                </div>
                <div class="card border-0">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Mã GV</th>
                                    <th>Họ tên giảng viên</th>
                                    <th>Bộ môn</th>
                                    <th class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="assignTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals (Course) -->
    <div class="modal fade" id="courseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-0 pt-4 px-4">
                    <h5 class="fw-bold" id="courseModalTitle">Cập nhật môn học</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="editMaMH">
                    <div class="mb-3">
                        <label class="form-label fw-600">Tên môn học</label>
                        <input type="text" id="formTenMH" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-600">Số tín chỉ</label>
                        <input type="number" id="formSoTC" class="form-control" min="1" max="10" required>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button class="btn btn-primary w-100 py-2 fw-bold" onclick="saveCourse()">LƯU THÔNG TIN</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="assignModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-0 pt-4 px-4">
                    <h5 class="fw-bold">Phân công giảng viên</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-600">Chọn giảng viên trong khoa:</label>
                        <select id="formMaGV" class="form-select"></select>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button class="btn btn-success w-100 py-2 fw-bold" onclick="saveAssignment()">XÁC NHẬN PHÂN CÔNG</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script src="../Assets/js/layout.js"></script>
    <script>
        Auth.checkAuth(['TruongKhoa']);
        const user = Auth.getCurrentUser();
        let cM, aM, myKhoa = '';

        function init() {
            cM = new bootstrap.Modal(document.getElementById('courseModal'));
            aM = new bootstrap.Modal(document.getElementById('assignModal'));
            const me = JSON.parse(localStorage.getItem('GiaoVien') || '[]').find(g => g.MaGV === user.MaNguoiDung);
            myKhoa = me ? me.MaKhoa : '';
            renderCourses();
            initAssignTab();
        }

        function renderCourses() {
            const mh = JSON.parse(localStorage.getItem('MonHoc') || '[]').filter(m => m.MaKhoa === myKhoa);
            const gvdm = JSON.parse(localStorage.getItem('GiaoVienDayMon') || '[]');
            const lhp = JSON.parse(localStorage.getItem('LopHocPhan') || '[]');
            document.getElementById('courseTableBody').innerHTML = mh.map(m => `
                <tr>
                    <td><span class="fw-600">${m.MaMH}</span></td>
                    <td>${m.TenMH}</td>
                    <td class="text-center">${m.SoTinChi}</td>
                    <td class="text-center"><span class="badge bg-info-subtle text-info">${gvdm.filter(g => g.MaMH === m.MaMH).length} GV</span></td>
                    <td class="text-center">
                        <button class="btn btn-link btn-sm p-1" onclick="editCourse('${m.MaMH}')"><span class="material-symbols-outlined text-accent">edit</span></button>
                        <button class="btn btn-link btn-sm p-1" onclick="deleteCourse('${m.MaMH}', ${lhp.some(l => l.MaMH === m.MaMH)})"><span class="material-symbols-outlined text-danger">delete</span></button>
                    </td>
                </tr>
            `).join('');
            document.getElementById('assignCourseSelect').innerHTML = '<option value="">-- Chọn môn học --</option>' + mh.map(m => `<option value="${m.MaMH}">${m.TenMH}</option>`).join('');
        }

        window.openCourseModal = () => { document.getElementById('courseModalTitle').innerText = 'Thêm môn học mới'; document.getElementById('editMaMH').value = ''; document.getElementById('formTenMH').value = ''; document.getElementById('formSoTC').value = 3; cM.show(); };
        window.editCourse = (id) => { const m = JSON.parse(localStorage.getItem('MonHoc') || '[]').find(x => x.MaMH === id); document.getElementById('courseModalTitle').innerText = 'Sửa môn học: ' + id; document.getElementById('editMaMH').value = id; document.getElementById('formTenMH').value = m.TenMH; document.getElementById('formSoTC').value = m.SoTinChi; cM.show(); };
        window.saveCourse = () => {
            const id = document.getElementById('editMaMH').value, d = JSON.parse(localStorage.getItem('MonHoc') || '[]');
            const obj = { MaMH: id || 'MH' + Date.now(), TenMH: document.getElementById('formTenMH').value, SoTinChi: parseInt(document.getElementById('formSoTC').value), MaKhoa: myKhoa };
            if (id) { const i = d.findIndex(x => x.MaMH === id); d[i] = obj; } else { d.push(obj); }
            localStorage.setItem('MonHoc', JSON.stringify(d)); cM.hide(); renderCourses();
        };
        window.deleteCourse = (id, has) => { if (has) return alert('Không thể xóa môn đã có lớp!'); if (confirm('Xóa môn học này?')) { const d = JSON.parse(localStorage.getItem('MonHoc') || '[]').filter(x => x.MaMH !== id); localStorage.setItem('MonHoc', JSON.stringify(d)); renderCourses(); } };

        function initAssignTab() { const gv = JSON.parse(localStorage.getItem('GiaoVien') || '[]').filter(g => g.MaKhoa === myKhoa); document.getElementById('formMaGV').innerHTML = gv.map(g => `<option value="${g.MaGV}">${g.HoTen} (${g.MaGV})</option>`).join(''); }
        window.renderAssignments = () => {
            const id = document.getElementById('assignCourseSelect').value, btn = document.getElementById('btnAddAssign');
            if (!id) { btn.disabled = true; document.getElementById('assignTableBody').innerHTML = '<tr><td colspan="4" class="text-center py-4">Vui lòng chọn môn học</td></tr>'; return; }
            btn.disabled = false;
            const gvdm = JSON.parse(localStorage.getItem('GiaoVienDayMon') || '[]').filter(x => x.MaMH === id), gvD = JSON.parse(localStorage.getItem('GiaoVien') || '[]'), bmD = JSON.parse(localStorage.getItem('BoMon') || '[]');
            document.getElementById('assignTableBody').innerHTML = gvdm.map(a => { const gv = gvD.find(g => g.MaGV === a.MaGV) || {}, bm = bmD.find(b => b.MaBoMon === gv.MaBoMon) || {}; return `<tr><td><strong>${a.MaGV}</strong></td><td>${gv.HoTen}</td><td>${bm.TenBoMon}</td><td class="text-center"><button class="btn btn-link btn-sm p-1" onclick="deleteAssignment('${a.MaGV}', '${id}')"><span class="material-symbols-outlined text-danger">person_remove</span></button></td></tr>`; }).join('') || '<tr><td colspan="4" class="text-center py-4">Chưa có GV nào được phân công</td></tr>';
        };
        window.openAssignModal = () => aM.show();
        window.saveAssignment = () => {
            const m = document.getElementById('assignCourseSelect').value, g = document.getElementById('formMaGV').value, d = JSON.parse(localStorage.getItem('GiaoVienDayMon') || '[]');
            if (d.some(x => x.MaMH === m && x.MaGV === g)) return alert('Đã phân công rồi!');
            d.push({ MaGV: g, MaMH: m }); localStorage.setItem('GiaoVienDayMon', JSON.stringify(d)); aM.hide(); renderAssignments(); renderCourses();
        };
        window.deleteAssignment = (g, m) => { if (confirm('Xóa phân công?')) { const d = JSON.parse(localStorage.getItem('GiaoVienDayMon') || '[]').filter(x => !(x.MaGV === g && x.MaMH === m)); localStorage.setItem('GiaoVienDayMon', JSON.stringify(d)); renderAssignments(); renderCourses(); } };
        init();
    </script>
</body>
</html>
