<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Điểm - Trưởng khoa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="css/truong-khoa.css">
</head>
<body>
    <div id="main-wrapper">
        <aside class="sidebar" id="dynamicSidebar"></aside>

        <header class="navbar">
            <div class="search-container">
                <span class="material-symbols-outlined me-2 text-muted">search</span>
                <input type="text" placeholder="Tìm sinh viên..." id="searchInput" oninput="renderGrades()">
            </div>
            <div class="d-flex align-items-center">
                <span class="me-3 fw-bold" id="facultyName">Khoa: ...</span>
                <img id="userAvatar" src="" class="avatar" style="width: 40px; height: 40px; border-radius: 50%;">
            </div>
        </header>

        <main class="main-content" style="padding-top: 100px; padding-left: 300px; padding-right: 2rem; background: #f8fafc; min-height: 100vh;">
            <div class="animate__animated animate__fadeIn">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Quản lý Điểm</h2>
                        <p class="text-muted mb-0">Nhập và chỉnh sửa điểm cho các lớp Trưởng khoa phụ trách.</p>
                    </div>
                    <div class="d-flex gap-3">
                        <select class="form-select border-0 bg-white shadow-sm rounded-pill px-4" id="lhpSelect" style="width: 300px;" onchange="renderGrades()">
                            <option value="">-- Chọn lớp học phần --</option>
                        </select>
                        <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" onclick="saveAllGrades()">
                            <span class="material-symbols-outlined align-middle me-1">save</span> LƯU TẤT CẢ
                        </button>
                    </div>
                </div>

                <div class="dean-card p-0 overflow-hidden border">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="bg-light">
                                <tr class="text-muted small">
                                    <th class="ps-4">MSSV</th>
                                    <th>HỌ VÀ TÊN</th>
                                    <th class="text-center">ĐIỂM QUÁ TRÌNH (40%)</th>
                                    <th class="text-center">ĐIỂM CUỐI KỲ (60%)</th>
                                    <th class="text-center">TỔNG KẾT</th>
                                    <th class="text-center">KẾT QUẢ</th>
                                </tr>
                            </thead>
                            <tbody id="gradeTableBody">
                                <tr><td colspan="6" class="text-center py-5 text-muted">Vui lòng chọn lớp học phần để nhập điểm</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Assets/js/mock-database.js"></script>
    <script src="../Assets/js/auth.js"></script>
    <script>
        Auth.checkAuth(['TruongKhoa']);
        const user = Auth.getCurrentUser();

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            const path = window.location.pathname;
            const isPage = (p) => path.includes(p);

            sidebar.innerHTML = `
                <div class="nav-brand text-start px-4 py-4">
                    <div style="color: #818cf8; font-size: 1.5rem; font-weight: 800;">EduManage</div>
                    <div style="font-size: 0.8rem; font-weight: 500; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Quản trị Cấp Khoa</div>
                </div>
                <ul class="nav-menu list-unstyled px-2">
                    <li class="${isPage('dashboard.html') ? 'active' : ''}"><a href="dashboard.html" class="d-flex align-items-center gap-3 p-3 text-decoration-none text-white rounded-3"><span class="material-symbols-outlined">dashboard</span>Tổng quan</a></li>
                    <li class="${isPage('quan-ly-mon-hoc.html') ? 'active' : ''}"><a href="quan-ly-mon-hoc.html" class="d-flex align-items-center gap-3 p-3 text-decoration-none text-white rounded-3"><span class="material-symbols-outlined">menu_book</span>Quản lý Môn học</a></li>
                    <hr class="border-secondary opacity-25">
                    <li class="${isPage('lich-day.html') ? 'active' : ''}"><a href="lich-day.html" class="d-flex align-items-center gap-3 p-3 text-decoration-none text-white rounded-3"><span class="material-symbols-outlined">calendar_month</span>Lịch dạy cá nhân</a></li>
                    <li class="${isPage('nhap-diem.html') ? 'active' : ''}"><a href="nhap-diem.html" class="d-flex align-items-center gap-3 p-3 text-decoration-none text-white rounded-3"><span class="material-symbols-outlined">edit_square</span>Quản lý Điểm</a></li>
                </ul>
                <div class="sidebar-footer">
                    <ul class="list-unstyled px-2">
                        <li class="${isPage('ho-so.html') ? 'active' : ''}"><a href="ho-so.html" class="d-flex align-items-center gap-3 p-3 text-decoration-none text-white rounded-3"><span class="material-symbols-outlined">account_circle</span>Hồ sơ Cá nhân</a></li>
                        <li><a href="#" onclick="Auth.logout()" class="d-flex align-items-center gap-3 p-3 text-decoration-none text-danger rounded-3"><span class="material-symbols-outlined">logout</span>Đăng xuất</a></li>
                    </ul>
                </div>
            `;
        }

        let currentPage = 1;
        const rowsPerPage = 10;
        let allFilteredRegs = [];

        // Lấy Token xác thực
        const getToken = () => {
            const userStr = localStorage.getItem('currentUser');
            return userStr ? JSON.parse(userStr).Token : null;
        };

        // 1. GỌI API KHỞI TẠO (Lấy thông tin và Danh sách Lớp học phần)
        async function init() {
            renderSidebar();
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=TK&background=4f46e5&color=fff`;
            
            const token = getToken();
            if (!token) return alert("Vui lòng đăng nhập lại!");

            try {
                // Tạm gán tên khoa, nếu nhóm ông có API lấy info user thì nạp vào đây
                document.getElementById('facultyName').innerText = 'Khoa của bạn';

                // Gọi API số 10: Lấy danh sách lớp học phần
                const response = await fetch('http://localhost:5123/api/TruongKhoa/lop-hoc-phan', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const myClasses = await response.json();

                // Đổ vào Dropdown
                document.getElementById('lhpSelect').innerHTML = '<option value="">-- Chọn lớp học phần --</option>' + 
                    myClasses.map(l => `<option value="${l.MaLHP}">${l.MaLHP} - ${l.TenMH}</option>`).join('');

            } catch (err) {
                console.error("Lỗi khởi tạo:", err);
            }
        }

        // 2. GỌI API LẤY DANH SÁCH ĐIỂM (Khi chọn lớp hoặc gõ tìm kiếm)
        window.renderGrades = async () => {
            const malhp = document.getElementById('lhpSelect').value;
            const token = getToken();

            if (!malhp) { 
                document.getElementById('gradeTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">Vui lòng chọn lớp học phần để nhập điểm</td></tr>'; 
                renderPagination(0, 0);
                return; 
            }
            
            try {
                // Gọi API số 11: Lấy danh sách sinh viên & điểm
                const response = await fetch(`http://localhost:5123/api/TruongKhoa/diem-lhp/${malhp}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const dataTuDB = await response.json();

                const search = document.getElementById('searchInput').value.toLowerCase();
                
                // Lọc theo thanh tìm kiếm (FE)
                allFilteredRegs = dataTuDB.filter(d => {
                    // Lấy đúng tên biến từ Database lên (TenSV), thêm '' để chống lỗi undefined
                    const tenSV = (d.TenSV || d.tensv || d.HoTen || '').toLowerCase();
                    const maSV = (d.MaSV || d.masv || '').toLowerCase();
                    
                    return tenSV.includes(search) || maSV.includes(search);
                });

                currentPage = 1;
                renderGradeTable();
            } catch (err) {
                console.error("Lỗi tải điểm:", err);
                document.getElementById('gradeTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-5 text-danger">Lỗi tải dữ liệu từ máy chủ!</td></tr>';
            }
        }

        // 3. VẼ BẢNG ĐIỂM VÀ PHÂN TRANG
        function renderGradeTable() {
            const totalRows = allFilteredRegs.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);
            const startIdx = (currentPage - 1) * rowsPerPage;
            const paginatedData = allFilteredRegs.slice(startIdx, startIdx + rowsPerPage);

            document.getElementById('gradeTableBody').innerHTML = paginatedData.map(d => {
                const qt = d.DiemGiuaKy !== null ? d.DiemGiuaKy : '';
                const ck = d.DiemCuoiKy !== null ? d.DiemCuoiKy : '';
                
                // Tính điểm tổng kết an toàn
                let tk = '---';
                let pass = false;
                if (qt !== '' && ck !== '') {
                    const numTk = (parseFloat(qt) * 0.4 + parseFloat(ck) * 0.6);
                    tk = numTk.toFixed(1);
                    pass = numTk >= 4.0;
                }

                return `
                    <tr class="animate__animated animate__fadeIn" data-ma-dk="${d.MaDK}">
                        <td class="ps-4 fw-bold text-primary">${d.MaSV}</td>
                        <td class="fw-bold">${d.TenSV || d.tensv || d.HoTen || 'Chưa có tên'}</td>
                        <td class="text-center">
                            <input type="number" class="grade-input qt border rounded px-2 py-1 text-center bg-light" style="width: 70px;" value="${qt}" min="0" max="10" step="0.1" oninput="updateRow(this)">
                        </td>
                        <td class="text-center">
                            <input type="number" class="grade-input ck border rounded px-2 py-1 text-center bg-light" style="width: 70px;" value="${ck}" min="0" max="10" step="0.1" oninput="updateRow(this)">
                        </td>
                        <td class="text-center">
                            <span class="fw-bold tk ${tk !== '---' && pass ? 'text-success' : (tk !== '---' ? 'text-danger' : 'text-muted')}">${tk}</span>
                        </td>
                        <td class="text-center">
                            ${tk !== '---' ? 
                                `<span class="badge ${pass ? 'bg-success' : 'bg-danger'} rounded-pill px-3 py-2">${pass ? 'Đạt' : 'Nợ môn'}</span>` 
                                : `<span class="badge bg-secondary-subtle text-secondary rounded-pill px-3 py-2">Chưa có</span>`
                            }
                        </td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="6" class="text-center py-5">Không tìm thấy sinh viên nào</td></tr>';

            renderPagination(totalRows, totalPages);
        }

        // Ràng buộc kiểm soát dữ liệu nhập
        window.updateRow = (input) => {
            if (input.value !== '') {
                let val = parseFloat(input.value);
                if (isNaN(val) || val < 0) {
                    input.value = 0; 
                } else if (val > 10) {
                    input.value = 10;
                }
            }

            const tr = input.closest('tr');
            const qtVal = tr.querySelector('.qt').value;
            const ckVal = tr.querySelector('.ck').value;
            const tkEl = tr.querySelector('.tk');
            const badge = tr.querySelector('.badge');
            
            if (qtVal !== '' && ckVal !== '') {
                const qt = parseFloat(qtVal) || 0;
                const ck = parseFloat(ckVal) || 0;
                const tk = (qt * 0.4 + ck * 0.6);
                
                tkEl.innerText = tk.toFixed(1);
                tkEl.className = `fw-bold tk ${tk >= 4.0 ? 'text-success' : 'text-danger'}`;
                badge.className = `badge ${tk >= 4.0 ? 'bg-success' : 'bg-danger'} rounded-pill px-3 py-2`;
                badge.innerText = tk >= 4.0 ? 'Đạt' : 'Nợ môn';
            } else {
                tkEl.innerText = '---';
                tkEl.className = 'fw-bold tk text-muted';
                badge.className = 'badge bg-secondary-subtle text-secondary rounded-pill px-3 py-2';
                badge.innerText = 'Chưa có';
            }
        };

        // Phân trang
        function renderPagination(totalRows, totalPages) {
            let container = document.getElementById('paginationContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'paginationContainer';
                container.className = 'pagination-container py-3 px-4 bg-light border-top d-flex justify-content-between align-items-center';
                document.querySelector('.dean-card').appendChild(container);
            }

            if (totalRows === 0) {
                container.innerHTML = '';
                return;
            }

            const start = (currentPage - 1) * rowsPerPage + 1;
            const end = Math.min(currentPage * rowsPerPage, totalRows);

            container.innerHTML = `
                <div class="pagination-info text-muted small">
                    Hiển thị <b class="text-dark">${start}-${end}</b> trong tổng số <b class="text-dark">${totalRows}</b> sinh viên
                </div>
                <div class="pagination-nav d-flex gap-1">
                    <button class="btn btn-sm btn-white border" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                        <span class="material-symbols-outlined align-middle" style="font-size: 18px;">chevron_left</span>
                    </button>
                    ${Array.from({length: totalPages}, (_, i) => i + 1).map(p => `
                        <button class="btn btn-sm ${p === currentPage ? 'btn-primary' : 'btn-white border'}" onclick="changePage(${p})">${p}</button>
                    `).join('')}
                    <button class="btn btn-sm btn-white border" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                        <span class="material-symbols-outlined align-middle" style="font-size: 18px;">chevron_right</span>
                    </button>
                </div>
            `;
        }

        window.changePage = (page) => {
            currentPage = page;
            renderGradeTable();
        }

        // 4. GỌI API LƯU ĐIỂM HÀNG LOẠT
        window.saveAllGrades = async () => {
            const malhp = document.getElementById('lhpSelect').value;
            if (!malhp) return alert("Vui lòng chọn lớp học phần trước khi lưu!");

            const token = getToken();
            const danhSachDiem = [];
            
            // Lấy tất cả các dòng dữ liệu đang hiển thị
            const rows = document.querySelectorAll('#gradeTableBody tr[data-ma-dk]');
            
            rows.forEach(tr => {
                const qtVal = tr.querySelector('.qt').value;
                const ckVal = tr.querySelector('.ck').value;
                
                // Chỉ lưu những dòng có nhập điểm
                if (qtVal !== '' && ckVal !== '') {
                    danhSachDiem.push({
                        MaDK: tr.dataset.maDk,
                        DiemGiuaKy: parseFloat(qtVal) || 0,
                        DiemCuoiKy: parseFloat(ckVal) || 0
                    });
                }
            });

            if (danhSachDiem.length === 0) return alert("Không có điểm nào được nhập để lưu!");

            try {
                // Gọi API số 12: Gửi cục data xuống Backend
                const response = await fetch('http://localhost:5123/api/TruongKhoa/luu-diem', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ danhSachDiem })
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.message);

                alert("🎉 " + result.message);
                renderGrades(); // Load lại data từ Server để xác nhận
            } catch (err) {
                console.error(err);
                alert("Lỗi: " + err.message);
            }
        };

        init();
    </script>
</body>
</html>
